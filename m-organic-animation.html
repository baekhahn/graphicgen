<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organic M Animation</title>
  <style>
    :root {
      --bg: #000;
      --shape: #f3f3f3;
      --dot: #63f5b7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 30%, #101010 0%, #000 55%);
      color: #fff;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
    }

    .wrap {
      width: min(92vw, 760px);
      aspect-ratio: 375 / 281;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .block {
      fill: var(--shape);
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.1));
    }

    .dot {
      fill: var(--dot);
      opacity: 0.2;
    }

  </style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 375 281" aria-label="Connected M with linked-corner resizing">
      <g id="blocks"></g>
      <g id="dots"></g>
    </svg>
  </div>

  <script>
    // Geometry from Vector.svg
    const bounds = {
      x0: 0,
      x1: 121.447,
      x2: 213.906,
      x3: 291.805,
      x4: 340.649,
      x5: 374.999,
      y0: 0,
      y1: 103.938,
      y2: 280.446
    };

    const blockGroup = document.getElementById("blocks");
    const dotGroup = document.getElementById("dots");

    const shapes = Array.from({ length: 5 }, () => {
      const p = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      p.setAttribute("class", "block");
      blockGroup.appendChild(p);
      return p;
    });

    // Visualize shared corner nodes.
    const dotNodes = Array.from({ length: 14 }, () => {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("class", "dot");
      c.setAttribute("r", "2.6");
      dotGroup.appendChild(c);
      return c;
    });

    function rectPoints(xL, xR, yT, yB) {
      return `${xL},${yB} ${xR},${yB} ${xR},${yT} ${xL},${yT}`;
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function clamp01(v) {
      return Math.max(0, Math.min(1, v));
    }

    function easeInOutCubic(v) {
      const t = clamp01(v);
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function easeOutBack(v) {
      const t = clamp01(v);
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function blendEase(v) {
      // Primary cubic easing + slight back-overshoot flavor for livelier motion.
      const a = easeInOutCubic(v);
      const b = easeOutBack(v);
      return a * 0.85 + b * 0.15;
    }

    function damp(current, target, lambda, dtSec) {
      return current + (target - current) * (1 - Math.exp(-lambda * dtSec));
    }

    function catmullRom(p0, p1, p2, p3, t) {
      const t2 = t * t;
      const t3 = t2 * t;
      return 0.5 * (
        (2 * p1) +
        (-p0 + p2) * t +
        (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
        (-p0 + 3 * p1 - 3 * p2 + p3) * t3
      );
    }

    const baseWidths = [
      bounds.x1 - bounds.x0, // bottom 1
      bounds.x2 - bounds.x1, // top 4
      bounds.x3 - bounds.x2, // bottom 2
      bounds.x4 - bounds.x3, // top 5
      bounds.x5 - bounds.x4  // bottom 3
    ];

    // Width multipliers in order: [bottom1, top4, bottom2, top5, bottom3]
    // Sequence: 1 -> 2 -> 3 -> 2 -> 1
    const keyframes = [
      [1.55, 1.24, 0.72, 0.86, 0.74], // 1 grows
      [0.84, 1.08, 1.46, 0.96, 0.80], // 2 grows
      [0.76, 0.88, 0.82, 1.20, 1.56], // 3 grows
      [0.84, 1.08, 1.46, 0.96, 0.80], // 2 grows again
      [1.55, 1.24, 0.72, 0.86, 0.74]  // back to 1
    ];

    const frameMs = 420;
    const totalMs = keyframes.length * frameMs;
    const baseY1 = bounds.y1;
    const yAmp = 22;
    const yCycleMs = totalMs;
    const renderState = { x1: bounds.x1, x2: bounds.x2, x3: bounds.x3, x4: bounds.x4, y1: bounds.y1 };
    let lastTs = 0;

    function composeWidths(tMs) {
      const n = keyframes.length;
      const timeWarp = 0.16 * Math.sin(tMs * 0.0011) + 0.07 * Math.sin(tMs * 0.0019 + 0.8);
      const pos = (((tMs % totalMs) / frameMs) + timeWarp + n) % n;
      const i1 = Math.floor(pos);
      const i0 = (i1 - 1 + n) % n;
      const i2 = (i1 + 1) % n;
      const i3 = (i1 + 2) % n;
      const mix = blendEase(pos - i1);

      const raw = baseWidths.map((w, idx) => {
        const m = catmullRom(
          keyframes[i0][idx],
          keyframes[i1][idx],
          keyframes[i2][idx],
          keyframes[i3][idx],
          mix
        );
        const drift = 1 + 0.035 * Math.sin(tMs * 0.0009 + idx * 1.37);
        return w * m * drift;
      });

      const rawSum = raw.reduce((sum, v) => sum + v, 0);
      const total = bounds.x5 - bounds.x0;
      const scale = total / rawSum;
      return raw.map((v) => v * scale);
    }

    function render(tMs) {
      const dtSec = lastTs ? (tMs - lastTs) / 1000 : 1 / 60;
      lastTs = tMs;
      const [w1, w4, w2, w5, w3] = composeWidths(tMs);

      const targetX1 = bounds.x0 + w1;
      const targetX2 = targetX1 + w4;
      const targetX3 = targetX2 + w2;
      const targetX4 = targetX3 + w5;

      const yProgress = (tMs % yCycleMs) / yCycleMs;
      const yWave = Math.sin(yProgress * Math.PI * 2) + 0.28 * Math.sin(yProgress * Math.PI * 4 + 0.6);
      const yShaped = yWave >= 0 ? easeOutBack(clamp01(yWave)) : -easeInOutCubic(clamp01(-yWave));
      const targetY1 = clamp(baseY1 + yShaped * yAmp, bounds.y0 + 40, bounds.y2 - 44);

      renderState.x1 = damp(renderState.x1, targetX1, 11.5, dtSec);
      renderState.x2 = damp(renderState.x2, targetX2, 10.5, dtSec);
      renderState.x3 = damp(renderState.x3, targetX3, 10.2, dtSec);
      renderState.x4 = damp(renderState.x4, targetX4, 9.8, dtSec);
      renderState.y1 = damp(renderState.y1, targetY1, 8.5, dtSec);

      let x1 = renderState.x1;
      let x2 = renderState.x2;
      let x3 = renderState.x3;
      let x4 = renderState.x4;
      let y1 = renderState.y1;

      // Hard safety clamp to preserve valid rectangles.
      x1 = clamp(x1, bounds.x0 + 10, bounds.x2 - 8);
      x2 = clamp(x2, x1 + 8, bounds.x3 - 8);
      x3 = clamp(x3, x2 + 8, bounds.x4 - 8);
      x4 = clamp(x4, x3 + 8, bounds.x5 - 8);
      y1 = clamp(y1, bounds.y0 + 40, bounds.y2 - 44);

      // Top row: 2 boxes
      shapes[0].setAttribute("points", rectPoints(x1, x2, bounds.y0, y1));
      shapes[1].setAttribute("points", rectPoints(x3, x4, bounds.y0, y1));
      // Bottom row: 3 boxes
      shapes[2].setAttribute("points", rectPoints(bounds.x0, x1, y1, bounds.y2));
      shapes[3].setAttribute("points", rectPoints(x2, x3, y1, bounds.y2));
      shapes[4].setAttribute("points", rectPoints(x4, bounds.x5, y1, bounds.y2));

      const corners = [
        [bounds.x0, y1], [x1, y1], [x2, y1], [x3, y1], [x4, y1], [bounds.x5, y1],
        [x1, bounds.y0], [x2, bounds.y0], [x3, bounds.y0], [x4, bounds.y0],
        [bounds.x0, bounds.y2], [x1, bounds.y2], [x2, bounds.y2], [x3, bounds.y2], [x4, bounds.y2], [bounds.x5, bounds.y2]
      ];

      // Use first 14 points for a subtle guide only.
      dotNodes.forEach((dot, i) => {
        const [x, y] = corners[i];
        dot.setAttribute("cx", x);
        dot.setAttribute("cy", y);
      });

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
