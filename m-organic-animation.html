<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volumetric Split</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: min(100vw, 200svh); height: auto; cursor: grab; touch-action: none; background: #000; }
  </style>
</head>
<body>
  <canvas id="stage" width="1600" height="800" aria-label="XYZ 축으로 공간을 연속 분할하고 마우스로 회전하는 3차원 애니메이션"></canvas>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const WIDTH = canvas.width, HEIGHT = canvas.height;
    const ROOT = { min: { x: -1.18, y: -0.66, z: -0.76 }, max: { x: 1.18, y: 0.66, z: 0.76 } };
    const AXES = ["x", "y", "z"];
    const EDGE_INDEXES = [[0, 1], [0, 2], [0, 4], [1, 3], [1, 5], [2, 3], [2, 6], [3, 7], [4, 5], [4, 6], [5, 7], [6, 7]];
    const MOVE_MS = 420, MIN_LEAVES = 8, MAX_LEAVES = 38, CAMERA = 4.2, SCALE = 610;
    const startedAt = performance.now();
    const random = randomFor(Date.now());
    const nodeFor = (box) => ({ box, cut: null, a: null, b: null, lockUntil: 0 });
    let tree = nodeFor(ROOT), action = null, nextActionAt = startedAt + 200;
    let yaw = -0.68, pitch = 0.32, dragPoint = null, lastAxis = -1;
    const openingAxes = ["x", "y", "z"];

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const lerp = (a, b, t) => a + (b - a) * t;
    const pointLerp = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), z: lerp(a.z, b.z, t) });
    const midpoint = (a, b) => pointLerp(a, b, 0.5);
    const smoothstep = (start, end, value) => { const t = clamp((value - start) / (end - start), 0, 1); return t * t * (3 - 2 * t); };
    const easeOut = (value) => 1 - (1 - clamp(value, 0, 1)) ** 3;

    function randomFor(seed) {
      let state = seed >>> 0;
      return () => {
        state += 0x6D2B79F5;
        let value = state;
        value = Math.imul(value ^ (value >>> 15), value | 1);
        value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
        return ((value ^ (value >>> 14)) >>> 0) / 4_294_967_296;
      };
    }

    function boxVolume(box) {
      return (box.max.x - box.min.x) * (box.max.y - box.min.y) * (box.max.z - box.min.z);
    }

    function boxCorners(box) {
      const { min, max } = box;
      return [
        { x: min.x, y: min.y, z: min.z }, { x: max.x, y: min.y, z: min.z },
        { x: min.x, y: max.y, z: min.z }, { x: max.x, y: max.y, z: min.z },
        { x: min.x, y: min.y, z: max.z }, { x: max.x, y: min.y, z: max.z },
        { x: min.x, y: max.y, z: max.z }, { x: max.x, y: max.y, z: max.z }
      ];
    }

    function planeCorners(box, axis, value) {
      const { min, max } = box;
      if (axis === "x") return [{ x: value, y: min.y, z: min.z }, { x: value, y: max.y, z: min.z }, { x: value, y: max.y, z: max.z }, { x: value, y: min.y, z: max.z }];
      if (axis === "y") return [{ x: min.x, y: value, z: min.z }, { x: max.x, y: value, z: min.z }, { x: max.x, y: value, z: max.z }, { x: min.x, y: value, z: max.z }];
      return [{ x: min.x, y: min.y, z: value }, { x: max.x, y: min.y, z: value }, { x: max.x, y: max.y, z: value }, { x: min.x, y: max.y, z: value }];
    }

    function splitBox(box, axis, value) {
      const lower = { min: { ...box.min }, max: { ...box.max } }, upper = { min: { ...box.min }, max: { ...box.max } };
      lower.max[axis] = value;
      upper.min[axis] = value;
      return [lower, upper];
    }

    function leaves(node, output = []) {
      if (!node.cut) output.push(node);
      else { leaves(node.a, output); leaves(node.b, output); }
      return output;
    }

    function cherries(node, output = []) {
      if (!node.cut) return output;
      if (!node.a.cut && !node.b.cut) output.push(node);
      else { cherries(node.a, output); cherries(node.b, output); }
      return output;
    }

    function pickByVolume(nodes) {
      let threshold = random() * nodes.reduce((sum, node) => sum + boxVolume(node.box) ** 0.72, 0);
      for (const node of nodes) {
        threshold -= boxVolume(node.box) ** 0.72;
        if (threshold <= 0) return node;
      }
      return nodes[nodes.length - 1];
    }

    function chooseAxis(node) {
      const viable = AXES.filter((axis) => node.box.max[axis] - node.box.min[axis] > 0.10);
      const opening = openingAxes[0];
      if (viable.includes(opening)) {
        openingAxes.shift();
        lastAxis = AXES.indexOf(opening);
        return opening;
      }
      const different = viable.filter((axis) => axis !== AXES[lastAxis]);
      const choices = different.length ? different : viable;
      const axis = choices[Math.floor(random() * choices.length)];
      lastAxis = AXES.indexOf(axis);
      return axis;
    }

    function startSplit(node, now) {
      const axis = chooseAxis(node);
      if (!axis) return false;
      const value = lerp(node.box.min[axis], node.box.max[axis], 0.30 + random() * 0.40);
      const [lower, upper] = splitBox(node.box, axis, value);
      node.a = nodeFor(lower);
      node.b = nodeFor(upper);
      node.cut = { corners: planeCorners(node.box, axis, value), direction: 1, started: now };
      node.lockUntil = now + 2_500;
      action = { node, mode: "in", started: now };
      return true;
    }

    function startMerge(node, now) {
      node.cut.direction = -1;
      node.cut.started = now;
      action = { node, mode: "out", started: now };
    }

    function startChange(now) {
      const leafNodes = leaves(tree), cutNodes = cherries(tree);
      const shouldSplit = leafNodes.length < MIN_LEAVES || (leafNodes.length < MAX_LEAVES && (!cutNodes.length || random() < 0.57));
      if (shouldSplit && startSplit(pickByVolume(leafNodes), now)) return true;
      const cooled = cutNodes.filter((node) => node.lockUntil <= now);
      if (!cooled.length) return false;
      startMerge(pickByVolume(cooled), now);
      return true;
    }

    function tick(now) {
      if (action && now - action.started >= MOVE_MS) {
        if (action.mode === "in") action.node.cut.direction = 0;
        else Object.assign(action.node, { cut: null, a: null, b: null });
        action = null;
        nextActionAt = now + 55 + random() * 110;
      }
      if (!action && now >= nextActionAt && !startChange(now)) nextActionAt = now + 180;
    }

    function project(point) {
      const x = point.x * Math.cos(yaw) + point.z * Math.sin(yaw);
      const depth = -point.x * Math.sin(yaw) + point.z * Math.cos(yaw);
      const y = point.y * Math.cos(pitch) - depth * Math.sin(pitch);
      const z = point.y * Math.sin(pitch) + depth * Math.cos(pitch);
      const zoom = CAMERA / (CAMERA - z);
      return { x: WIDTH / 2 + x * SCALE * zoom, y: HEIGHT / 2 + y * SCALE * zoom, zoom };
    }

    function drawLine(a, b, opacity) {
      const start = project(a), end = project(b);
      ctx.globalAlpha = opacity;
      ctx.lineWidth = (start.zoom + end.zoom) * 0.9;
      ctx.beginPath();
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(end.x, end.y);
      ctx.stroke();
    }

    function drawPlane(corners, progress, opacity) {
      for (let i = 0; i < 4; i += 1) {
        const a = corners[i], b = corners[(i + 1) % 4], center = midpoint(a, b), growth = easeOut(progress);
        drawLine(center, pointLerp(center, a, growth), opacity);
        drawLine(center, pointLerp(center, b, growth), opacity);
      }
    }

    function collectCuts(node, now, output = []) {
      if (!node.cut) return output;
      const ratio = clamp((now - node.cut.started) / MOVE_MS, 0, 1);
      const progress = node.cut.direction === 1 ? easeOut(ratio) : node.cut.direction === -1 ? 1 - easeOut(ratio) : 1;
      output.push({ corners: node.cut.corners, progress, opacity: node.cut.direction === -1 ? progress : 1 });
      collectCuts(node.a, now, output);
      collectCuts(node.b, now, output);
      return output;
    }

    function render(now) {
      tick(now);
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.strokeStyle = "#fff";
      ctx.lineCap = "square";
      const corners = boxCorners(ROOT);
      for (const [from, to] of EDGE_INDEXES) drawLine(corners[from], corners[to], 0.82);
      for (const cut of collectCuts(tree, now)) drawPlane(cut.corners, cut.progress, cut.opacity);
      requestAnimationFrame(render);
    }

    canvas.addEventListener("pointerdown", (event) => {
      dragPoint = { x: event.clientX, y: event.clientY };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!dragPoint) return;
      yaw += (event.clientX - dragPoint.x) * 0.008;
      pitch = clamp(pitch + (event.clientY - dragPoint.y) * 0.008, -1.15, 1.15);
      dragPoint = { x: event.clientX, y: event.clientY };
    });
    ["pointerup", "pointercancel"].forEach((type) => canvas.addEventListener(type, () => { dragPoint = null; }));
    requestAnimationFrame(render);
  </script>
</body>
</html>
