<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixelation</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap");

    :root {
      --bg: #090909;
      --panel: #121212;
      --ink: #f2f2f2;
      --muted: #a8a8a8;
      --line: #2a2a2a;
      --accent: #f2f2f2;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--ink);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 10%, #181818 0%, rgba(24, 24, 24, 0) 40%),
        radial-gradient(circle at 85% 90%, #151515 0%, rgba(21, 21, 21, 0) 35%),
        var(--bg);
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
      padding: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.45);
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
    }

    .title-select {
      margin: 0 0 8px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 15px;
      letter-spacing: 0.02em;
      font-weight: 700;
    }

    p.sub {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 11px;
    }

    .control {
      margin-bottom: 12px;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 6px;
      color: var(--muted);
    }

    input[type="range"], select, input[type="file"], button {
      width: 100%;
    }

    input[type="range"] {
      appearance: none;
      -webkit-appearance: none;
      height: 2px;
      border-radius: 999px;
      background: #2d2d2d;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid #d8d8d8;
      background: #0f0f0f;
      box-shadow: none;
      cursor: ew-resize;
    }

    input[type="range"]::-moz-range-track {
      height: 2px;
      border: none;
      border-radius: 999px;
      background: #2d2d2d;
    }

    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid #d8d8d8;
      background: #0f0f0f;
      cursor: ew-resize;
    }

    select, button, input[type="file"] {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 8px;
      background: #0f0f0f;
      color: var(--ink);
      font-family: inherit;
      font-size: 11px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    button:hover {
      background: #1b1b1b;
      border-color: #3a3a3a;
    }

    .canvas-wrap {
      background: #050505;
      border-radius: 16px;
      border: 1px solid #1f1f1f;
      overflow: hidden;
      min-height: 70vh;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      grid-column: 1;
      grid-row: 1;
    }

    canvas {
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
      display: block;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .tab-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
      padding: 6px;
      border: 0;
      border-radius: 12px;
      background: #0e0e0e;
    }

    .tab-radio {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      background: #0f0f0f;
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 120ms ease, color 120ms ease, background-color 120ms ease;
      user-select: none;
    }

    .tab-radio input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .tab-radio .radio-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      border: 1px solid var(--muted);
      background: transparent;
    }

    .tab-radio.active {
      color: var(--ink);
      border-color: transparent;
      background: #141414;
    }

    .tab-radio.active .radio-dot {
      border-color: var(--ink);
      background: var(--ink);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }
    .button-row + .button-row {
      margin-top: 10px;
    }

    .download-section-title {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.02em;
    }

    .hint {
      margin-top: 6px;
      font-size: 10px;
      color: var(--muted);
    }

    .hint a {
      color: inherit;
      text-decoration: none;
    }

    .panel-footer {
      margin: auto 0 0;
      font-size: 10px;
      color: var(--muted);
    }

    .panel-footer a {
      color: inherit;
      text-decoration: none;
    }

    .check-control {
      margin-top: 8px;
      margin-bottom: 18px;
      padding-bottom: 2px;
    }

    .check-control label {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      margin-bottom: 0;
      cursor: pointer;
    }

    .check-control input[type="checkbox"] {
      width: auto;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .file-picker {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #0f0f0f;
    }

    .control .file-btn {
      display: inline-block;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 7px 10px;
      background: #202020;
      color: var(--ink);
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      margin-bottom: 0;
      justify-content: initial;
    }

    .control .file-btn:hover {
      background: #2a2a2a;
      border-color: #4a4a4a;
    }

    .file-name {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 960px) {
      body {
        grid-template-columns: 1fr;
      }
      .canvas-wrap {
        grid-column: 1;
        grid-row: 1;
      }
      .panel {
        grid-column: 1;
        grid-row: 2;
      }
      .canvas-wrap {
        min-height: 48vh;
      }
    }
  </style>
</head>
<body>
  <aside class="panel">
    <select id="toolPreset" class="title-select" aria-label="Tool preset">
      <option value="" disabled>Choose Effects</option>
      <option value="pixelation-base">Pixelation</option>
      <option value="photo-enhance">Photo Enhance</option>
      <option value="noir-contrast">Noir Contrast</option>
      <option value="soft-vintage">Soft Vintage</option>
      <option value="crt-grit">CRT Grit</option>
    </select>

    <div class="tab-row">
      <label class="tab-radio active">
        <input type="radio" name="inputMode" value="upload" checked />
        <span class="radio-dot" aria-hidden="true"></span>
        Upload
      </label>
      <label class="tab-radio">
        <input type="radio" name="inputMode" value="source" />
        <span class="radio-dot" aria-hidden="true"></span>
        Data Source
      </label>
    </div>

    <div id="uploadPanel" class="tab-panel active">
      <div class="control">
        <label>Upload Image / Video</label>
        <input id="fileInput" class="file-input" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" />
        <div class="file-picker">
          <label for="fileInput" class="file-btn">Choose File</label>
          <span id="fileNameText" class="file-name">No file selected</span>
        </div>
        <p class="hint">MP4/WebM/MOV input supported.</p>
      </div>
    </div>

    <div id="sourcePanel" class="tab-panel">
      <div class="control">
        <label for="dataSource">Data Source</label>
        <select id="dataSource">
          <option value="">None (upload or manual)</option>
          <option value="nasa-svs">NASA SVS (Scientific Visualization Studio)</option>
          <option value="nasa-image-video">NASA Image & Video Library</option>
          <option value="nasa-earth-observatory-video">NASA Earth Observatory Videos</option>
          <option value="nasa-heasarc-video">NASA HEASARC Video Archive</option>
          <option value="nasa-landsat-archive-video">NASA Landsat Archive Video</option>
          <option value="noaa-ocean-exploration">NOAA Ocean Exploration Video Portal</option>
          <option value="usgs-shakemovie">USGS ShakeMovie (Seismic Waves)</option>
          <option value="iris-usarray">IRIS USArray Wave Visualizations</option>
          <option value="seismic-sound-lab">Seismic Sound Lab Wave Movies</option>
          <option value="jhtdb-video">JHTDB Turbulence Videos</option>
          <option value="cymatics-video">Cymatics Video (YouTube/Kaggle)</option>
          <option value="chladni-video">Chladni Patterns (MIT OCW)</option>
          <option value="custom-video">Custom Video URL (MP4/WebM)</option>
        </select>
        <p id="dataSourceLink" class="hint"></p>
        <div id="customVideoWrap" class="control" style="display: none;">
          <label for="customVideoUrl">Custom Video URL</label>
          <input id="customVideoUrl" type="text" placeholder="https://.../sample.mp4" />
        </div>
        <div class="control check-control">
        <label for="dataSourceVideoSample">
          <input id="dataSourceVideoSample" type="checkbox" checked />
          Video mode sample
        </label>
      </div>
        <p id="dataSourceStatus" class="hint"></p>
      </div>
    </div>
    <div class="row">
      <div class="control">
        <label for="mode">Output Mode</label>
        <select id="mode">
          <option value="mono">Mono</option>
          <option value="rgb">RGB</option>
        </select>
      </div>
      <div class="control">
        <label for="method">Algorithm</label>
        <select id="method">
          <option value="floyd">Floyd-Steinberg</option>
          <option value="bayer4">Bayer 4x4</option>
          <option value="random">Random Threshold</option>
          <option value="ascii">ASCII</option>
        </select>
      </div>
    </div>

    <div class="control">
      <label for="pixelSize">Pixel Size <span id="pixelSizeVal"></span></label>
      <input id="pixelSize" type="range" min="1" max="12" value="4" />
    </div>

    <div class="control">
      <label for="levels">Levels <span id="levelsVal"></span></label>
      <input id="levels" type="range" min="2" max="8" value="2" />
    </div>

    <div class="control">
      <label for="contrast">Contrast <span id="contrastVal"></span></label>
      <input id="contrast" type="range" min="0" max="3" step="0.01" value="1.2" />
    </div>

    <div class="control">
      <label for="brightness">Brightness <span id="brightnessVal"></span></label>
      <input id="brightness" type="range" min="-120" max="120" value="0" />
    </div>

    <div class="control">
      <label for="gamma">Gamma <span id="gammaVal"></span></label>
      <input id="gamma" type="range" min="0.3" max="2.6" step="0.01" value="1" />
    </div>

    <div class="control">
      <label for="noise">Noise <span id="noiseVal"></span></label>
      <input id="noise" type="range" min="0" max="80" value="0" />
    </div>

    <div class="control">
      <label for="blur">Blur <span id="blurVal"></span></label>
      <input id="blur" type="range" min="0" max="4" step="0.1" value="0" />
    </div>

    <div class="row">
      <div class="control">
        <label for="blackPoint">Black Point <span id="blackPointVal"></span></label>
        <input id="blackPoint" type="range" min="0" max="100" value="0" />
      </div>
      <div class="control">
        <label for="whitePoint">White Point <span id="whitePointVal"></span></label>
        <input id="whitePoint" type="range" min="155" max="255" value="255" />
      </div>
    </div>

    <p class="download-section-title">Download Option</p>
    <div class="row button-row">
      <button id="downloadSvgBtn" type="button">SVG</button>
      <button id="downloadBtn" type="button">PNG</button>
    </div>
    <div class="control check-control">
      <label for="svgBlackOnly">
        <input id="svgBlackOnly" type="checkbox" checked />
        SVG: Black only (remove white area)
      </label>
    </div>
    <div class="row button-row">
      <button id="playPauseBtn" type="button" disabled>Play</button>
      <button id="recordBtn" type="button" disabled>Export</button>
    </div>
    <p class="hint">Export auto-converts WebM to MP4.</p>
    <p id="statusText" class="hint"></p>
    <p class="panel-footer"><a href="https://miterlab.com/" target="_blank" rel="noopener noreferrer">©2026 Miterlab Inc.</a></p>
  </aside>

  <main class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </main>

  <script type="module">
    import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js";
    import { fetchFile, toBlobURL } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const work = document.createElement("canvas");
    const wctx = work.getContext("2d", { willReadFrequently: true });
    const sourceVideo = document.createElement("video");
    sourceVideo.muted = true;
    sourceVideo.loop = true;
    sourceVideo.playsInline = true;
    sourceVideo.preload = "auto";

    const tabRadios = document.querySelectorAll("input[name='inputMode']");
    const tabRadioLabels = document.querySelectorAll(".tab-radio");

    const controls = {
      fileInput: document.getElementById("fileInput"),
      fileNameText: document.getElementById("fileNameText"),
      uploadPanel: document.getElementById("uploadPanel"),
      sourcePanel: document.getElementById("sourcePanel"),
      dataSource: document.getElementById("dataSource"),
      dataSourceLink: document.getElementById("dataSourceLink"),
      customVideoWrap: document.getElementById("customVideoWrap"),
      customVideoUrl: document.getElementById("customVideoUrl"),
      dataSourceVideoSample: document.getElementById("dataSourceVideoSample"),
      dataSourceStatus: document.getElementById("dataSourceStatus"),
      mode: document.getElementById("mode"),
      method: document.getElementById("method"),
      toolPreset: document.getElementById("toolPreset"),
      pixelSize: document.getElementById("pixelSize"),
      levels: document.getElementById("levels"),
      contrast: document.getElementById("contrast"),
      brightness: document.getElementById("brightness"),
      gamma: document.getElementById("gamma"),
      noise: document.getElementById("noise"),
      blur: document.getElementById("blur"),
      blackPoint: document.getElementById("blackPoint"),
      whitePoint: document.getElementById("whitePoint"),
      playPauseBtn: document.getElementById("playPauseBtn"),
      downloadBtn: document.getElementById("downloadBtn"),
      downloadSvgBtn: document.getElementById("downloadSvgBtn"),
      svgBlackOnly: document.getElementById("svgBlackOnly"),
      recordBtn: document.getElementById("recordBtn"),
      statusText: document.getElementById("statusText"),
    };

    const valueViews = {
      pixelSize: document.getElementById("pixelSizeVal"),
      levels: document.getElementById("levelsVal"),
      contrast: document.getElementById("contrastVal"),
      brightness: document.getElementById("brightnessVal"),
      gamma: document.getElementById("gammaVal"),
      noise: document.getElementById("noiseVal"),
      blur: document.getElementById("blurVal"),
      blackPoint: document.getElementById("blackPointVal"),
      whitePoint: document.getElementById("whitePointVal"),
    };

    const presetOptionLabels = new Map(
      Array.from(controls.toolPreset.options).map((opt) => [opt.value, opt.textContent])
    );

    const state = {
      original: null,
      sourceW: 0,
      sourceH: 0,
      sourceType: "image",
      videoRafId: null,
      activeObjectUrl: null,
      recorder: null,
      recordChunks: [],
      isRecording: false,
      loopBeforeRecord: null,
      recordEndHandler: null,
      ffmpeg: null,
      ffmpegLoaded: false,
      ffmpegLoading: false,
      isTranscoding: false,
      cancelNextRecordingOutput: false,
      exportCount: 0,
      selectedPreset: "pixelation-base",
      sampleStream: null,
      sampleRafId: null,
      sampleSeed: 0,
      refreshSeed: 0,
    };

    const bayer4 = [
      [0, 8, 2, 10],
      [12, 4, 14, 6],
      [3, 11, 1, 9],
      [15, 7, 13, 5],
    ];

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function setStatus(text) {
      controls.statusText.textContent = text || "";
    }

    function nextExportFileName(ext) {
      state.exportCount += 1;
      const n = String(state.exportCount).padStart(3, "0");
      return `Pixelation_${n}.${ext}`;
    }

    const toolPresets = {
      "pixelation-base": {
        mode: "mono",
        method: "floyd",
        pixelSize: 4,
        levels: 2,
        contrast: 1.2,
        brightness: 0,
        gamma: 1,
        noise: 0,
        blur: 0,
        blackPoint: 0,
        whitePoint: 255,
      },
      "photo-enhance": {
        mode: "rgb",
        method: "bayer4",
        pixelSize: 2,
        levels: 6,
        contrast: 1.1,
        brightness: 8,
        gamma: 0.95,
        noise: 0,
        blur: 0.3,
        blackPoint: 0,
        whitePoint: 245,
      },
      "noir-contrast": {
        mode: "mono",
        method: "floyd",
        pixelSize: 3,
        levels: 2,
        contrast: 1.8,
        brightness: -10,
        gamma: 0.85,
        noise: 6,
        blur: 0,
        blackPoint: 12,
        whitePoint: 225,
      },
      "soft-vintage": {
        mode: "rgb",
        method: "random",
        pixelSize: 3,
        levels: 5,
        contrast: 0.9,
        brightness: 12,
        gamma: 1.12,
        noise: 4,
        blur: 0.6,
        blackPoint: 0,
        whitePoint: 240,
      },
      "crt-grit": {
        mode: "rgb",
        method: "bayer4",
        pixelSize: 5,
        levels: 4,
        contrast: 1.45,
        brightness: -4,
        gamma: 0.92,
        noise: 12,
        blur: 0.2,
        blackPoint: 4,
        whitePoint: 238,
      },
    };

    const dataSources = {
      "nasa-svs": {
        desc: "NASA Scientific Visualization Studio (MP4/WebM animations).",
        url: "https://svs.gsfc.nasa.gov/",
        prefersVideo: true,
      },
      "nasa-image-video": {
        desc: "NASA Image and Video Library (search & download videos).",
        url: "https://www.nasa.gov/stem-content/nasa-image-and-video-library/",
        prefersVideo: true,
      },
      "nasa-earth-observatory-video": {
        desc: "Earth Observatory videos and features.",
        url: "https://earthobservatory.nasa.gov/",
        prefersVideo: true,
      },
      "nasa-heasarc-video": {
        desc: "HEASARC video archive (high-energy astrophysics animations).",
        url: "https://heasarc.gsfc.nasa.gov/docs/heasarc/videos/videos.html",
        prefersVideo: true,
      },
      "nasa-landsat-archive-video": {
        desc: "Landsat video archives and historical footage.",
        url: "https://landsat.gsfc.nasa.gov/article/landsat-video-from-the-archives/",
        prefersVideo: true,
      },
      "noaa-ocean-exploration": {
        desc: "NOAA Ocean Exploration video portal (public domain video).",
        url: "https://oceanexplorer.noaa.gov/data/access-tools/",
        prefersVideo: true,
      },
      "usgs-shakemovie": {
        desc: "USGS ShakeMovie animations of seismic wave propagation.",
        url: "https://www.usgs.gov/centers/earthquake-science-center/multimedia/videos",
        prefersVideo: true,
      },
      "iris-usarray": {
        desc: "USArray wave visualizations from real earthquake data.",
        url: "https://www.iris.edu/hq/programs/epo/visualizations",
        prefersVideo: true,
      },
      "seismic-sound-lab": {
        desc: "Seismic wave field movies with audio from real data.",
        url: "https://seismicsoundlab.github.io/movies/specfemtohoku/",
        prefersVideo: true,
      },
      "jhtdb-video": {
        desc: "Turbulence visualization videos (JHTDB).",
        url: "https://turbulence.pha.jhu.edu/vid2.aspx",
        prefersVideo: true,
      },
      "cymatics-video": {
        desc: "Cymatics experiment footage and frames (YouTube/Kaggle).",
        url: "https://www.kaggle.com/",
        prefersVideo: true,
      },
      "chladni-video": {
        desc: "Chladni pattern lecture/demos (MIT OCW).",
        url: "https://ocw.mit.edu/",
        prefersVideo: true,
      },
      "custom-video": {
        desc: "Provide your own MP4/WebM URL.",
        url: "",
        prefersVideo: true,
      },
    };

    function applyToolPreset(name) {
      const preset = toolPresets[name];
      if (!preset) return;
      controls.mode.value = preset.mode;
      controls.method.value = preset.method;
      controls.pixelSize.value = String(preset.pixelSize);
      controls.levels.value = String(preset.levels);
      controls.contrast.value = String(preset.contrast);
      controls.brightness.value = String(preset.brightness);
      controls.gamma.value = String(preset.gamma);
      controls.noise.value = String(preset.noise);
      controls.blur.value = String(preset.blur);
      controls.blackPoint.value = String(preset.blackPoint);
      controls.whitePoint.value = String(preset.whitePoint);
      processImage();
    }


    function updateDataSourceInfo() {
      const selected = dataSources[controls.dataSource.value];
      if (!selected) {
        controls.dataSourceLink.textContent = "";
        controls.dataSourceStatus.textContent = "";
        controls.customVideoWrap.style.display = "none";
        return;
      }
      if (selected.url) {
        controls.dataSourceLink.innerHTML = `Source: <a href="${selected.url}" target="_blank" rel="noopener noreferrer">${selected.url}</a>`;
      } else {
        controls.dataSourceLink.textContent = "";
      }
      controls.dataSourceStatus.textContent = "Use local sample or open source link.";
      controls.customVideoWrap.style.display = controls.dataSource.value === "custom-video" ? "block" : "none";
      if (selected.prefersVideo) {
        controls.dataSourceVideoSample.checked = true;
      }
    }

    function stopSampleStream() {
      if (state.sampleRafId) {
        cancelAnimationFrame(state.sampleRafId);
        state.sampleRafId = null;
      }
      if (state.sampleStream) {
        state.sampleStream.getTracks().forEach((t) => t.stop());
        state.sampleStream = null;
      }
    }

    function loadImageFromDataUrl(dataUrl) {
      stopCurrentMedia();
      const img = new Image();
      img.onload = () => {
        const size = fitSourceSize(img.naturalWidth, img.naturalHeight);
        state.sourceW = size.w;
        state.sourceH = size.h;
        state.original = img;
        state.sourceType = "image";
        processImage();
      };
      img.src = dataUrl;
    }

    function makeSampleCanvas() {
      const c = document.createElement("canvas");
      c.width = 900;
      c.height = 560;
      return c;
    }

    function createDefaultPlaceholder() {
      const sample = document.createElement("canvas");
      sample.width = 900;
      sample.height = 560;
      const sctx = sample.getContext("2d");

      const g = sctx.createLinearGradient(0, 0, sample.width, sample.height);
      g.addColorStop(0, "#f5d68a");
      g.addColorStop(0.5, "#db7f53");
      g.addColorStop(1, "#2f2725");
      sctx.fillStyle = g;
      sctx.fillRect(0, 0, sample.width, sample.height);

      sctx.fillStyle = "rgba(255,255,255,0.35)";
      sctx.beginPath();
      sctx.arc(220, 180, 120, 0, Math.PI * 2);
      sctx.fill();

      sctx.fillStyle = "rgba(20,20,20,0.35)";
      sctx.beginPath();
      sctx.ellipse(630, 330, 190, 120, 0.2, 0, Math.PI * 2);
      sctx.fill();

      sctx.fillStyle = "rgba(255,255,255,0.8)";
      sctx.font = "700 64px 'JetBrains Mono', monospace";
      sctx.fillText("DITHER", 260, 315);

      return sample.toDataURL("image/png");
    }

    function hashString(s) {
      let x = 2166136261;
      for (let i = 0; i < s.length; i++) x = (x ^ s.charCodeAt(i)) * 16777619;
      return x >>> 0;
    }

    function makeSeededRngFromSeed(seed) {
      let x = seed >>> 0;
      if (!x) x = 123456789;
      return () => {
        x ^= x << 13;
        x ^= x >>> 17;
        x ^= x << 5;
        return (x >>> 0) / 4294967296;
      };
    }

    function makeSeededRng(key, baseSeed = null) {
      const seed = baseSeed !== null ? baseSeed : Math.floor(state.sampleSeed * 1e9);
      return makeSeededRngFromSeed((hashString(key) ^ seed) >>> 0);
    }

    function getSourceSeed(key) {
      if (!state.refreshSeed) state.refreshSeed = Math.floor(Math.random() * 1e9);
      return (hashString(key) ^ state.refreshSeed) >>> 0;
    }

    function generateWaveformSample(style, rng) {
      const c = makeSampleCanvas();
      const cctx = c.getContext("2d");
      const palettes = [
        ["#0b0b0b", "#f2f2f2"],
        ["#0a0f14", "#9fd3ff"],
        ["#101012", "#ffd166"],
      ];
      const palette = palettes[Math.floor(rng() * palettes.length)];
      cctx.fillStyle = palette[0];
      cctx.fillRect(0, 0, c.width, c.height);
      cctx.strokeStyle = palette[1];
      cctx.lineWidth = 1.5 + rng() * 1.5;
      cctx.beginPath();
      const mid = c.height / 2;
      const phase = rng() * Math.PI * 2;
      for (let x = 0; x < c.width; x++) {
        const t = x / c.width;
        const ampBase = style === "speech" ? 80 : 120;
        const freqBase = style === "urban" ? 8 : 5;
        const amp = ampBase * (0.7 + rng() * 0.6);
        const freq = freqBase + (rng() * 2 - 1);
        const y =
          mid +
          Math.sin(t * Math.PI * 2 * freq + phase) *
            amp *
            (0.55 + 0.45 * Math.sin(t * Math.PI * 2 + phase));
        if (x === 0) cctx.moveTo(x, y);
        else cctx.lineTo(x, y);
      }
      cctx.stroke();
      return c;
    }

    function generateChladniSample(rng) {
      const c = makeSampleCanvas();
      const cctx = c.getContext("2d");
      cctx.fillStyle = rng() > 0.5 ? "#111" : "#0e0e10";
      cctx.fillRect(0, 0, c.width, c.height);
      const mode = Math.floor(rng() * 3);
      cctx.strokeStyle = "#f2f2f2";
      cctx.lineWidth = 0.8 + rng() * 1.2;
      if (mode === 0) {
        const cols = 6 + Math.floor(rng() * 6);
        const rows = 5 + Math.floor(rng() * 5);
        for (let i = 1; i < cols; i++) {
          cctx.beginPath();
          cctx.moveTo((c.width / cols) * i, 0);
          cctx.lineTo((c.width / cols) * i, c.height);
          cctx.stroke();
        }
        for (let j = 1; j < rows; j++) {
          cctx.beginPath();
          cctx.moveTo(0, (c.height / rows) * j);
          cctx.lineTo(c.width, (c.height / rows) * j);
          cctx.stroke();
        }
      } else if (mode === 1) {
        const kx = 2 + Math.floor(rng() * 5);
        const ky = 2 + Math.floor(rng() * 4);
        for (let x = 0; x < c.width; x += 6) {
          const t = x / c.width;
          const y = c.height / 2 + Math.sin(t * Math.PI * 2 * kx) * (c.height * 0.25);
          cctx.beginPath();
          cctx.moveTo(x, 0);
          cctx.lineTo(x, y);
          cctx.stroke();
        }
        for (let y = 0; y < c.height; y += 6) {
          const t = y / c.height;
          const x = c.width / 2 + Math.sin(t * Math.PI * 2 * ky) * (c.width * 0.2);
          cctx.beginPath();
          cctx.moveTo(0, y);
          cctx.lineTo(x, y);
          cctx.stroke();
        }
      } else {
        const rings = 10 + Math.floor(rng() * 10);
        for (let i = 0; i < rings; i++) {
          const r = 20 + i * (8 + rng() * 6);
          cctx.beginPath();
          cctx.ellipse(c.width / 2, c.height / 2, r * (1.3 + rng() * 0.4), r, rng() * Math.PI, 0, Math.PI * 2);
          cctx.stroke();
        }
      }
      cctx.fillStyle = "rgba(255,255,255,0.5)";
      for (let k = 0; k < 30; k++) {
        cctx.fillRect(rng() * c.width, rng() * c.height, 1.2 + rng() * 1.2, 1.2 + rng() * 1.2);
      }
      return c;
    }

    function generateFluidSample(rng) {
      const c = makeSampleCanvas();
      const cctx = c.getContext("2d");
      const g = cctx.createLinearGradient(0, 0, c.width, c.height);
      const gradients = [
        ["#0c1a2b", "#162a3b", "#1f3b4d"],
        ["#101c2a", "#1b3a4a", "#224b6a"],
        ["#0a1a1d", "#14303b", "#1a4a57"],
      ];
      const palette = gradients[Math.floor(rng() * gradients.length)];
      g.addColorStop(0, palette[0]);
      g.addColorStop(0.5, palette[1]);
      g.addColorStop(1, palette[2]);
      cctx.fillStyle = g;
      cctx.fillRect(0, 0, c.width, c.height);
      cctx.strokeStyle = `rgba(255,255,255,${0.4 + rng() * 0.35})`;
      const bands = 10 + Math.floor(rng() * 8);
      for (let i = 0; i < bands; i++) {
        cctx.beginPath();
        const y = (c.height / bands) * i + 10 * Math.sin(i + rng());
        for (let x = 0; x < c.width; x += 8) {
          const t = x / c.width;
          const dy = (14 + rng() * 14) * Math.sin(t * Math.PI * (3 + rng() * 3) + i);
          if (x === 0) cctx.moveTo(x, y + dy);
          else cctx.lineTo(x, y + dy);
        }
        cctx.stroke();
      }
      return c;
    }

    function generateCymaticsSample(rng) {
      const c = makeSampleCanvas();
      const cctx = c.getContext("2d");
      cctx.fillStyle = "#0a0a0a";
      cctx.fillRect(0, 0, c.width, c.height);
      const mode = Math.floor(rng() * 3);
      cctx.strokeStyle = `rgba(255,255,255,${0.5 + rng() * 0.35})`;
      if (mode === 0) {
        const step = 12 + Math.floor(rng() * 10);
        const twist = rng() * 0.6;
        for (let r = 20; r < 260; r += step) {
          cctx.beginPath();
          cctx.ellipse(c.width / 2, c.height / 2, r * 1.6, r, twist, 0, Math.PI * 2);
          cctx.stroke();
        }
      } else if (mode === 1) {
        const spokes = 6 + Math.floor(rng() * 8);
        for (let s = 0; s < spokes; s++) {
          const angle = (Math.PI * 2 * s) / spokes;
          cctx.beginPath();
          for (let r = 20; r < 280; r += 6) {
            const wobble = 10 * Math.sin(r * 0.08 + rng() * 6);
            const x = c.width / 2 + Math.cos(angle) * (r + wobble);
            const y = c.height / 2 + Math.sin(angle) * (r + wobble);
            if (r === 20) cctx.moveTo(x, y);
            else cctx.lineTo(x, y);
          }
          cctx.stroke();
        }
      } else {
        const lobes = 4 + Math.floor(rng() * 6);
        for (let i = 0; i < 12; i++) {
          const r = 30 + i * 18;
          cctx.beginPath();
          for (let a = 0; a <= Math.PI * 2 + 0.01; a += Math.PI / 90) {
            const wave = Math.sin(a * lobes + i * 0.4) * (8 + rng() * 10);
            const x = c.width / 2 + Math.cos(a) * (r + wave);
            const y = c.height / 2 + Math.sin(a) * (r + wave);
            if (a === 0) cctx.moveTo(x, y);
            else cctx.lineTo(x, y);
          }
          cctx.stroke();
        }
      }
      return c;
    }

    function generateSampleForSource(key, sourceSeed) {
      const rng = makeSeededRngFromSeed(sourceSeed);
      if (key === "cymatics-video") return generateCymaticsSample(rng);
      if (key === "chladni-video") return generateChladniSample(rng);
      if (key === "nasa-svs") return generateFluidSample(rng);
      if (key === "nasa-image-video") return generateFluidSample(rng);
      if (key === "nasa-earth-observatory-video") return generateFluidSample(rng);
      if (key === "nasa-heasarc-video") return generateWaveformSample("env", rng);
      if (key === "nasa-landsat-archive-video") return generateFluidSample(rng);
      if (key === "noaa-ocean-exploration") return generateFluidSample(rng);
      if (key === "usgs-shakemovie") return generateWaveformSample("env", rng);
      if (key === "iris-usarray") return generateWaveformSample("env", rng);
      if (key === "seismic-sound-lab") return generateWaveformSample("urban", rng);
      if (key === "jhtdb-video") return generateFluidSample(rng);
      return null;
    }

    function startVideoSampleFromCanvas(drawFrame) {
      const c = makeSampleCanvas();
      const cctx = c.getContext("2d");
      let t = 0;
      const render = () => {
        drawFrame(cctx, t);
        t += 1 / 60;
        state.sampleRafId = requestAnimationFrame(render);
      };
      render();
      const stream = c.captureStream(30);
      state.sampleStream = stream;
      return { stream, width: c.width, height: c.height };
    }

    function loadVideoFromStream(stream, width, height) {
      state.sourceW = width;
      state.sourceH = height;
      state.original = sourceVideo;
      state.sourceType = "video";
      setVideoActionEnabled(true);
      controls.playPauseBtn.textContent = "Pause";
      sourceVideo.srcObject = stream;
      const tryPlay = () => {
        sourceVideo.play().then(() => {
          startVideoLoop();
          processImage();
        }).catch(() => {
          controls.playPauseBtn.textContent = "Play";
          processImage();
        });
      };
      sourceVideo.onloadedmetadata = () => {
        tryPlay();
      };
      // In some browsers, metadata doesn't fire for captureStream.
      setTimeout(tryPlay, 0);
    }

              ctx2d.beginPath();
              ctx2d.moveTo(w / 2, h / 2);
              ctx2d.lineTo(w / 2 + Math.cos(ang) * 220, h / 2 + Math.sin(ang) * 140);
              ctx2d.stroke();
            }
          } else {
            ctx2d.strokeStyle = "rgba(255,160,140,0.8)";
            for (let i = 0; i < 10; i++) {
              ctx2d.beginPath();
              const y = (h / 10) * i + 12 * Math.sin(t + i);
              for (let x = 0; x < w; x += 10) {
                const dy = 14 * Math.sin(t * 2 + x / 80 + i);
                if (x === 0) ctx2d.moveTo(x, y + dy);
                else ctx2d.lineTo(x, y + dy);
              }
              ctx2d.stroke();
            }
          }
          return;
        }
        if (key === "iris-usarray") {
          const irisMode = mode;
          if (irisMode === 0) {
            ctx2d.strokeStyle = palette[2];
            ctx2d.lineWidth = 1.2;
            for (let i = 0; i < 16; i++) {
              ctx2d.beginPath();
              for (let x = 0; x < w; x += 10) {
                const tt = x / w;
                const y = h / 2 + Math.sin(tt * Math.PI * 2 * 3 + t + i * 0.2) * (20 + i);
                if (x === 0) ctx2d.moveTo(x, y);
                else ctx2d.lineTo(x, y);
              }
              ctx2d.stroke();
            }
          } else if (irisMode === 1) {
            ctx2d.strokeStyle = "rgba(140,220,255,0.7)";
            for (let i = 0; i < 8; i++) {
              ctx2d.beginPath();
              const r = 60 + i * 30;
              ctx2d.arc(w / 2, h / 2, r, 0, Math.PI * 2);
              ctx2d.stroke();
            }
          } else {
            ctx2d.strokeStyle = "rgba(160,240,255,0.8)";
            for (let i = 0; i < 12; i++) {
              const x = (w / 12) * i + 10 * Math.sin(t + i);
              ctx2d.beginPath();
              ctx2d.moveTo(x, 0);
              ctx2d.lineTo(x, h);
              ctx2d.stroke();
            }
          }
          return;
        }
        if (key === "seismic-sound-lab") {
          const labMode = mode;
          if (labMode === 0) {
            const size = 24;
            for (let y = 0; y < h; y += size) {
              for (let x = 0; x < w; x += size) {
                const on = (x / size + y / size + Math.floor(t * 4)) % 2 === 0;
                ctx2d.fillStyle = on ? palette[2] : palette[0];
                ctx2d.fillRect(x, y, size - 2, size - 2);
              }
            }
          } else if (labMode === 1) {
            ctx2d.strokeStyle = "rgba(200,220,255,0.7)";
            for (let i = 0; i < 20; i++) {
              ctx2d.beginPath();
              const y = (h / 20) * i + 6 * Math.sin(t * 1.6 + i);
              ctx2d.moveTo(0, y);
              ctx2d.lineTo(w, y);
              ctx2d.stroke();
            }
          } else {
            ctx2d.strokeStyle = "rgba(140,200,255,0.7)";
            for (let i = 0; i < 12; i++) {
              const ang = (Math.PI * 2 * i) / 12 + t * 0.2;
              ctx2d.beginPath();
              ctx2d.moveTo(w / 2, h / 2);
              ctx2d.lineTo(w / 2 + Math.cos(ang) * 200, h / 2 + Math.sin(ang) * 140);
              ctx2d.stroke();
            }
          }
          return;
        }
        if (key === "jhtdb-video") {
          const jhMode = mode;
          if (jhMode === 0) {
            ctx2d.strokeStyle = palette[1];
            ctx2d.lineWidth = 1.5;
            for (let i = 0; i < 40; i++) {
              const x = (i * 37 + t * 80) % w;
              const y = (i * 59 + t * 50) % h;
              ctx2d.beginPath();
              ctx2d.arc(x, y, 8 + 6 * Math.sin(t + i), 0, Math.PI * 2);
              ctx2d.stroke();
            }
          } else if (jhMode === 1) {
            ctx2d.strokeStyle = "rgba(255,180,120,0.7)";
            for (let i = 0; i < 14; i++) {
              ctx2d.beginPath();
              const y = (h / 14) * i + 12 * Math.sin(t * 1.2 + i);
              for (let x = 0; x < w; x += 12) {
                const dy = 10 * Math.cos(t * 0.8 + x / 60 + i);
                if (x === 0) ctx2d.moveTo(x, y + dy);
                else ctx2d.lineTo(x, y + dy);
              }
              ctx2d.stroke();
            }
          } else {
            ctx2d.strokeStyle = "rgba(255,200,140,0.7)";
            for (let i = 0; i < 18; i++) {
              const ang = (Math.PI * 2 * i) / 18 + t * 0.25;
              ctx2d.beginPath();
              ctx2d.moveTo(w / 2, h / 2);
              ctx2d.lineTo(w / 2 + Math.cos(ang) * 200, h / 2 + Math.sin(ang) * 120);
              ctx2d.stroke();
            }
          }
          return;
        }
        if (key === "nasa-heasarc-video") {
          const heaMode = mode;
          if (heaMode === 0) {
            ctx2d.fillStyle = "rgba(255,255,255,0.8)";
            for (let i = 0; i < 160; i++) {
              const x = (i * 73 + t * 40) % w;
              const y = (i * 131 + t * 20) % h;
              ctx2d.fillRect(x, y, 1.2, 1.2);
            }
            ctx2d.strokeStyle = "rgba(255,180,120,0.9)";
            ctx2d.lineWidth = 2;
            ctx2d.beginPath();
            const pulse = 40 + 20 * Math.sin(t * 4);
            ctx2d.arc(w / 2, h / 2, pulse, 0, Math.PI * 2);
            ctx2d.stroke();
          } else if (heaMode === 1) {
            ctx2d.strokeStyle = "rgba(255,220,180,0.7)";
            for (let i = 0; i < 12; i++) {
              ctx2d.beginPath();
              const r = 40 + i * 26;
              ctx2d.ellipse(w / 2, h / 2, r * 1.2, r, t * 0.35 + i * 0.1, 0, Math.PI * 2);
              ctx2d.stroke();
            }
          } else {
            ctx2d.strokeStyle = "rgba(255,200,160,0.7)";
            for (let i = 0; i < 20; i++) {
              const ang = (Math.PI * 2 * i) / 20 + t * 0.3;
              ctx2d.beginPath();
              ctx2d.moveTo(w / 2, h / 2);
              ctx2d.lineTo(w / 2 + Math.cos(ang) * 220, h / 2 + Math.sin(ang) * 160);
              ctx2d.stroke();
            }
          }
          return;
        }
        if (key === "nasa-landsat-archive-video") {
          const landMode = mode;
          if (landMode === 0) {
            ctx2d.fillStyle = "rgba(80,140,220,0.5)";
            ctx2d.fillRect(0, 0, w, h);
            ctx2d.fillStyle = "rgba(255,255,255,0.35)";
            const stripeH = 28;
            for (let y = 0; y < h; y += stripeH * 2) {
              const offset = (t * 30) % (stripeH * 2);
              ctx2d.fillRect(0, y + offset, w, stripeH);
            }
          } else if (landMode === 1) {
            ctx2d.strokeStyle = "rgba(140,200,255,0.6)";
            for (let i = 0; i < 10; i++) {
              ctx2d.beginPath();
              const y = (h / 10) * i + 20 * Math.sin(t + i);
              for (let x = 0; x < w; x += 14) {
                const dy = 12 * Math.cos(t * 1.2 + x / 70 + i);
                if (x === 0) ctx2d.moveTo(x, y + dy);
                else ctx2d.lineTo(x, y + dy);
              }
              ctx2d.stroke();
            }
          } else {
            ctx2d.strokeStyle = "rgba(120,200,255,0.7)";
            for (let i = 0; i < 14; i++) {
              const x = (w / 14) * i + 12 * Math.sin(t + i);
              ctx2d.beginPath();
              ctx2d.moveTo(x, 0);
              ctx2d.lineTo(x, h);
              ctx2d.stroke();
            }
          }
          return;
        }
        // fallback waveform
        const mid = h / 2;
        const amp = key === "urbansound8k" ? 110 : 120;
        const freq = key === "urbansound8k" ? 9 : 5;
        ctx2d.beginPath();
        for (let x = 0; x < w; x++) {
          const tt = x / w;
          const y = mid + Math.sin(tt * Math.PI * 2 * freq + t * 2) * amp * (0.6 + 0.4 * Math.sin(tt * Math.PI * 2 + t));
          if (x === 0) ctx2d.moveTo(x, y);
          else ctx2d.lineTo(x, y);
        }
        ctx2d.stroke();
      };
      return startVideoSampleFromCanvas(drawer);
    }

    function syncMenuSelectionForOpen() {
      controls.toolPreset.value = state.selectedPreset;
    }

    function quantize(v, levels) {
      const step = 255 / (levels - 1);
      return Math.round(v / step) * step;
    }

    function renderAscii(lum, data, w, h, pixelSize, mode) {
      const chars = " .,:;irsXA253hMHGS#9B&@";
      const fontSize = Math.max(8, Math.floor(pixelSize * 1.35));
      canvas.width = w * pixelSize;
      canvas.height = h * pixelSize;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = `${fontSize}px 'JetBrains Mono', monospace`;
      ctx.textBaseline = "top";
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const p = y * w + x;
          const i = p * 4;
          const v = clamp(Math.round(lum[p]), 0, 255);
          const idx = Math.floor((v / 255) * (chars.length - 1));
          const ch = chars[idx];
          if (mode === "rgb") {
            ctx.fillStyle = `rgb(${data[i]}, ${data[i + 1]}, ${data[i + 2]})`;
          } else {
            ctx.fillStyle = "#f2f2f2";
          }
          ctx.fillText(ch, x * pixelSize, y * pixelSize);
        }
      }
    }

    function updateValueLabels() {
      Object.keys(valueViews).forEach((k) => {
        valueViews[k].textContent = controls[k].value;
      });
    }

    function setVideoActionEnabled(enabled) {
      controls.playPauseBtn.disabled = !enabled;
      controls.recordBtn.disabled = !enabled;
    }

    async function ensureFfmpegLoaded() {
      if (state.ffmpegLoaded && state.ffmpeg) return state.ffmpeg;
      if (state.ffmpegLoading) {
        while (state.ffmpegLoading) {
          await new Promise((resolve) => setTimeout(resolve, 100));
        }
        if (state.ffmpegLoaded && state.ffmpeg) return state.ffmpeg;
        throw new Error("FFmpeg loading failed");
      }

      state.ffmpegLoading = true;
      setStatus("Loading MP4 encoder...");
      try {
        const ffmpeg = new FFmpeg();
        const baseURL = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm";
        const coreURL = await toBlobURL(`${baseURL}/ffmpeg-core.js`, "text/javascript");
        const wasmURL = await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, "application/wasm");
        const workerURL = await toBlobURL(`${baseURL}/ffmpeg-core.worker.js`, "text/javascript");
        await ffmpeg.load({ coreURL, wasmURL, workerURL });
        state.ffmpeg = ffmpeg;
        state.ffmpegLoaded = true;
        setStatus("");
        return ffmpeg;
      } finally {
        state.ffmpegLoading = false;
      }
    }

    async function transcodeWebmToMp4(webmBlob) {
      const ffmpeg = await ensureFfmpegLoaded();
      state.isTranscoding = true;
      setVideoActionEnabled(false);
      setStatus("Converting to MP4... this may take a while.");

      try {
        await ffmpeg.writeFile("input.webm", await fetchFile(webmBlob));
        try {
          await ffmpeg.exec([
            "-i", "input.webm",
            "-c:v", "libx264",
            "-preset", "medium",
            "-crf", "18",
            "-pix_fmt", "yuv420p",
            "-movflags", "+faststart",
            "output.mp4",
          ]);
        } catch (_x264Err) {
          await ffmpeg.exec([
            "-i", "input.webm",
            "-c:v", "mpeg4",
            "-q:v", "2",
            "-pix_fmt", "yuv420p",
            "-movflags", "+faststart",
            "output.mp4",
          ]);
        }
        const mp4Data = await ffmpeg.readFile("output.mp4");
        return new Blob([mp4Data], { type: "video/mp4" });
      } finally {
        try { await ffmpeg.deleteFile("input.webm"); } catch (_e) {}
        try { await ffmpeg.deleteFile("output.mp4"); } catch (_e) {}
        state.isTranscoding = false;
        if (state.sourceType === "video") {
          setVideoActionEnabled(true);
          controls.playPauseBtn.textContent = sourceVideo.paused ? "Play" : "Pause";
          controls.recordBtn.textContent = state.isRecording ? "Stop Export" : "Export";
        }
        setStatus("");
      }
    }

    function fitSourceSize(w, h) {
      const maxEdge = 1920;
      const ratio = Math.min(1, maxEdge / Math.max(w, h));
      return {
        w: Math.max(1, Math.round(w * ratio)),
        h: Math.max(1, Math.round(h * ratio)),
      };
    }

    function processImage() {
      if (!state.original) return;

      updateValueLabels();

      const mode = controls.mode.value;
      const method = controls.method.value;
      const pixelSize = parseInt(controls.pixelSize.value, 10);
      const levels = parseInt(controls.levels.value, 10);
      const contrast = parseFloat(controls.contrast.value);
      const brightness = parseInt(controls.brightness.value, 10);
      const gamma = parseFloat(controls.gamma.value);
      const noiseAmount = parseFloat(controls.noise.value);
      const blur = parseFloat(controls.blur.value);
      const blackPoint = parseInt(controls.blackPoint.value, 10);
      const whitePoint = parseInt(controls.whitePoint.value, 10);

      const srcW = Math.max(1, Math.floor(state.sourceW / pixelSize));
      const srcH = Math.max(1, Math.floor(state.sourceH / pixelSize));

      if (work.width !== srcW || work.height !== srcH) {
        work.width = srcW;
        work.height = srcH;
      }

      wctx.filter = `blur(${blur}px)`;
      wctx.drawImage(state.original, 0, 0, srcW, srcH);
      wctx.filter = "none";

      const imageData = wctx.getImageData(0, 0, srcW, srcH);
      const data = imageData.data;
      const lum = new Float32Array(srcW * srcH);

      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];

        r = (r - 128) * contrast + 128 + brightness;
        g = (g - 128) * contrast + 128 + brightness;
        b = (b - 128) * contrast + 128 + brightness;

        if (noiseAmount > 0) {
          const n = (Math.random() * 2 - 1) * noiseAmount;
          r += n;
          g += n;
          b += n;
        }

        const mapTone = (v) => {
          const t = clamp((v - blackPoint) / Math.max(1, whitePoint - blackPoint), 0, 1);
          return clamp(Math.pow(t, 1 / gamma) * 255, 0, 255);
        };

        r = mapTone(r);
        g = mapTone(g);
        b = mapTone(b);

        data[i] = r;
        data[i + 1] = g;
        data[i + 2] = b;
        lum[p] = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      }

      if (method === "floyd") {
        if (mode === "mono") {
          applyFloydMono(lum, srcW, srcH, levels);
          for (let i = 0, p = 0; i < data.length; i += 4, p++) {
            const q = clamp(Math.round(lum[p]), 0, 255);
            data[i] = q;
            data[i + 1] = q;
            data[i + 2] = q;
          }
        } else {
          applyFloydRGB(data, srcW, srcH, levels);
        }
      } else if (method === "bayer4") {
        if (mode === "mono") {
          for (let y = 0; y < srcH; y++) {
            for (let x = 0; x < srcW; x++) {
              const p = y * srcW + x;
              const i = p * 4;
              const threshold = ((bayer4[y % 4][x % 4] + 0.5) / 16 - 0.5) * (255 / levels);
              const q = quantize(clamp(lum[p] + threshold, 0, 255), levels);
              data[i] = q;
              data[i + 1] = q;
              data[i + 2] = q;
            }
          }
        } else {
          applyBayerRGB(data, srcW, srcH, levels);
        }
      } else {
        if (method === "ascii") {
          renderAscii(lum, data, srcW, srcH, pixelSize, mode);
          return;
        }
        if (mode === "mono") {
          for (let y = 0; y < srcH; y++) {
            for (let x = 0; x < srcW; x++) {
              const p = y * srcW + x;
              const i = p * 4;
              const jitter = (Math.random() - 0.5) * (255 / levels);
              const q = quantize(clamp(lum[p] + jitter, 0, 255), levels);
              data[i] = q;
              data[i + 1] = q;
              data[i + 2] = q;
            }
          }
        } else {
          for (let i = 0; i < data.length; i += 4) {
            data[i] = quantize(clamp(data[i] + (Math.random() - 0.5) * (255 / levels), 0, 255), levels);
            data[i + 1] = quantize(clamp(data[i + 1] + (Math.random() - 0.5) * (255 / levels), 0, 255), levels);
            data[i + 2] = quantize(clamp(data[i + 2] + (Math.random() - 0.5) * (255 / levels), 0, 255), levels);
          }
        }
      }

      wctx.putImageData(imageData, 0, 0);

      canvas.width = srcW * pixelSize;
      canvas.height = srcH * pixelSize;
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(work, 0, 0, canvas.width, canvas.height);
    }

    function stopVideoLoop() {
      if (state.videoRafId) {
        cancelAnimationFrame(state.videoRafId);
        state.videoRafId = null;
      }
    }

    function getRecordMimeType() {
      const types = [
        "video/mp4;codecs=avc1.42E01E",
        "video/mp4",
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm",
      ];
      for (const t of types) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
      }
      return "";
    }

    function startVideoLoop() {
      if (state.sourceType !== "video") return;
      stopVideoLoop();

      const render = () => {
        if (state.sourceType !== "video") {
          stopVideoLoop();
          return;
        }
        if (!sourceVideo.paused && !sourceVideo.ended) {
          processImage();
          state.videoRafId = requestAnimationFrame(render);
          return;
        }
        state.videoRafId = null;
      };

      render();
    }

    function clearActiveObjectURL() {
      if (!state.activeObjectUrl) return;
      URL.revokeObjectURL(state.activeObjectUrl);
      state.activeObjectUrl = null;
    }

    function stopRecording() {
      if (!state.isRecording || !state.recorder) return;
      state.isRecording = false;
      controls.recordBtn.textContent = "Export";

      if (state.recordEndHandler) {
        sourceVideo.removeEventListener("ended", state.recordEndHandler);
        state.recordEndHandler = null;
      }

      if (state.loopBeforeRecord !== null) {
        sourceVideo.loop = state.loopBeforeRecord;
        state.loopBeforeRecord = null;
      }

      if (state.recorder.state !== "inactive") {
        state.recorder.stop();
      }
    }

    async function startRecording() {
      if (state.sourceType !== "video") return;
      if (state.isTranscoding) return;
      if (!window.MediaRecorder) {
        alert("This browser does not support video export (MediaRecorder).");
        return;
      }
      if (state.isRecording) return;

      const mimeType = getRecordMimeType();
      const stream = canvas.captureStream(60);
      const options = mimeType ? { mimeType, videoBitsPerSecond: 20_000_000 } : { videoBitsPerSecond: 20_000_000 };
      const recorder = new MediaRecorder(stream, options);
      state.recordChunks = [];
      state.recorder = recorder;

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) state.recordChunks.push(e.data);
      };

      recorder.onstop = async () => {
        if (state.cancelNextRecordingOutput) {
          state.cancelNextRecordingOutput = false;
          state.recordChunks = [];
          state.recorder = null;
          return;
        }
        const type = mimeType || "video/webm";
        const recordedBlob = new Blob(state.recordChunks, { type });
        state.recordChunks = [];
        state.recorder = null;
        if (type.includes("video/mp4")) {
          const directUrl = URL.createObjectURL(recordedBlob);
          const a = document.createElement("a");
          a.href = directUrl;
          a.download = nextExportFileName("mp4");
          a.click();
          setTimeout(() => URL.revokeObjectURL(directUrl), 1000);
          return;
        }
        try {
          const mp4Blob = await transcodeWebmToMp4(recordedBlob);
          const url = URL.createObjectURL(mp4Blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = nextExportFileName("mp4");
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (_err) {
          alert("MP4 conversion failed. Saving the original WebM instead.");
          const fallbackUrl = URL.createObjectURL(recordedBlob);
          const a = document.createElement("a");
          a.href = fallbackUrl;
          a.download = nextExportFileName("webm");
          a.click();
          setTimeout(() => URL.revokeObjectURL(fallbackUrl), 1000);
          setStatus("");
          if (state.sourceType === "video") setVideoActionEnabled(true);
        }
      };

      state.loopBeforeRecord = sourceVideo.loop;
      sourceVideo.loop = false;
      state.recordEndHandler = () => {
        stopRecording();
      };
      sourceVideo.addEventListener("ended", state.recordEndHandler, { once: true });

      // Always export full duration from the first frame.
      sourceVideo.pause();
      if (sourceVideo.currentTime !== 0) {
        await new Promise((resolve) => {
          const onSeeked = () => resolve();
          sourceVideo.addEventListener("seeked", onSeeked, { once: true });
          sourceVideo.currentTime = 0;
        });
      }
      processImage();

      recorder.start(250);
      state.isRecording = true;
      controls.recordBtn.textContent = "Stop Export";

      try {
        await sourceVideo.play();
      } catch (_err) {
        state.cancelNextRecordingOutput = true;
        stopRecording();
        sourceVideo.loop = state.loopBeforeRecord;
        state.loopBeforeRecord = null;
        state.recordEndHandler = null;
        state.recordChunks = [];
        state.recorder = null;
        alert("Cannot start export because video playback is blocked.");
        return;
      }

      startVideoLoop();
    }

    function stopCurrentMedia() {
      stopRecording();
      stopVideoLoop();
      stopSampleStream();
      sourceVideo.pause();
      sourceVideo.removeAttribute("src");
      sourceVideo.srcObject = null;
      sourceVideo.load();
      clearActiveObjectURL();
      controls.playPauseBtn.disabled = true;
      controls.playPauseBtn.textContent = "Play";
      controls.recordBtn.disabled = true;
      controls.recordBtn.textContent = "Export";
      setStatus("");
    }

    function applyFloydMono(buffer, w, h, levels) {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const oldPx = buffer[idx];
          const newPx = quantize(oldPx, levels);
          const err = oldPx - newPx;
          buffer[idx] = newPx;

          if (x + 1 < w) buffer[idx + 1] += err * (7 / 16);
          if (x - 1 >= 0 && y + 1 < h) buffer[idx + w - 1] += err * (3 / 16);
          if (y + 1 < h) buffer[idx + w] += err * (5 / 16);
          if (x + 1 < w && y + 1 < h) buffer[idx + w + 1] += err * (1 / 16);
        }
      }
    }

    function applyFloydRGB(data, w, h, levels) {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          for (let c = 0; c < 3; c++) {
            const oldPx = data[i + c];
            const newPx = quantize(oldPx, levels);
            const err = oldPx - newPx;
            data[i + c] = newPx;

            spreadError(data, w, h, x, y, c, err, 1, 0, 7 / 16);
            spreadError(data, w, h, x, y, c, err, -1, 1, 3 / 16);
            spreadError(data, w, h, x, y, c, err, 0, 1, 5 / 16);
            spreadError(data, w, h, x, y, c, err, 1, 1, 1 / 16);
          }
        }
      }
    }

    function spreadError(data, w, h, x, y, channel, err, ox, oy, factor) {
      const nx = x + ox;
      const ny = y + oy;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) return;
      const ni = (ny * w + nx) * 4 + channel;
      data[ni] = clamp(data[ni] + err * factor, 0, 255);
    }

    function applyBayerRGB(data, w, h, levels) {
      const scale = 255 / levels;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const t = ((bayer4[y % 4][x % 4] + 0.5) / 16 - 0.5) * scale;
          data[i] = quantize(clamp(data[i] + t, 0, 255), levels);
          data[i + 1] = quantize(clamp(data[i + 1] + t, 0, 255), levels);
          data[i + 2] = quantize(clamp(data[i + 2] + t, 0, 255), levels);
        }
      }
    }

    function loadImageFromFile(file) {
      stopCurrentMedia();
      const img = new Image();
      const url = URL.createObjectURL(file);
      state.activeObjectUrl = url;
      img.onload = () => {
        const size = fitSourceSize(img.naturalWidth, img.naturalHeight);
        state.sourceW = size.w;
        state.sourceH = size.h;
        state.original = img;
        state.sourceType = "image";
        processImage();
        clearActiveObjectURL();
      };
      img.src = url;
    }

    function loadVideoFromFile(file) {
      stopCurrentMedia();
      const url = URL.createObjectURL(file);
      state.activeObjectUrl = url;
      sourceVideo.src = url;

      sourceVideo.onloadedmetadata = () => {
        const size = fitSourceSize(sourceVideo.videoWidth, sourceVideo.videoHeight);
        state.sourceW = size.w;
        state.sourceH = size.h;
        state.original = sourceVideo;
        state.sourceType = "video";
        setVideoActionEnabled(true);
        controls.playPauseBtn.textContent = "Pause";
        clearActiveObjectURL();

        sourceVideo.play().then(() => {
          startVideoLoop();
        }).catch(() => {
          controls.playPauseBtn.textContent = "Play";
          processImage();
        });
      };
    }

    function channelToHex(v) {
      return clamp(v, 0, 255).toString(16).padStart(2, "0");
    }

    function alphaToSvgOpacity(a) {
      if (a >= 255) return "";
      const opacity = (a / 255).toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
      return ` fill-opacity="${opacity || "0"}"`;
    }

    function buildSvgFromWorkCanvas(blackOnly = false) {
      if (!work.width || !work.height) return "";

      const pixelSize = parseInt(controls.pixelSize.value, 10);
      const w = work.width;
      const h = work.height;
      const outW = w * pixelSize;
      const outH = h * pixelSize;
      const { data } = wctx.getImageData(0, 0, w, h);
      const parts = [
        `<?xml version="1.0" encoding="UTF-8"?>`,
        `<svg xmlns="http://www.w3.org/2000/svg" width="${outW}" height="${outH}" viewBox="0 0 ${outW} ${outH}" shape-rendering="crispEdges">`,
      ];

      const emitRun = (xStart, xEnd, y, r, g, b, a) => {
        if (xEnd <= xStart || a <= 0) return;
        if (blackOnly && (r > 40 || g > 40 || b > 40)) return;
        const fill = blackOnly ? "#000000" : `#${channelToHex(r)}${channelToHex(g)}${channelToHex(b)}`;
        const opacity = alphaToSvgOpacity(a);
        parts.push(
          `<rect x="${xStart * pixelSize}" y="${y * pixelSize}" width="${(xEnd - xStart) * pixelSize}" height="${pixelSize}" fill="${fill}"${opacity}/>`
        );
      };

      for (let y = 0; y < h; y++) {
        const rowStart = y * w * 4;
        let runStart = 0;
        let runR = data[rowStart];
        let runG = data[rowStart + 1];
        let runB = data[rowStart + 2];
        let runA = data[rowStart + 3];

        for (let x = 1; x <= w; x++) {
          const i = rowStart + x * 4;
          const atEnd = x === w;
          const r = atEnd ? -1 : data[i];
          const g = atEnd ? -1 : data[i + 1];
          const b = atEnd ? -1 : data[i + 2];
          const a = atEnd ? -1 : data[i + 3];
          const changed = atEnd || r !== runR || g !== runG || b !== runB || a !== runA;

          if (!changed) continue;

          emitRun(runStart, x, y, runR, runG, runB, runA);
          runStart = x;
          runR = r;
          runG = g;
          runB = b;
          runA = a;
        }
      }

      parts.push("</svg>");
      return parts.join("\n");
    }

    function storeUiState() {
      const params = new URLSearchParams();
      params.set("mode", controls.mode.value);
      params.set("method", controls.method.value);
      params.set("pixel", controls.pixelSize.value);
      params.set("levels", controls.levels.value);
      params.set("contrast", controls.contrast.value);
      params.set("brightness", controls.brightness.value);
      params.set("gamma", controls.gamma.value);
      params.set("noise", controls.noise.value);
      params.set("blur", controls.blur.value);
      params.set("black", controls.blackPoint.value);
      params.set("white", controls.whitePoint.value);
      params.set("svgBlackOnly", controls.svgBlackOnly.checked ? "1" : "0");
      params.set("videoSample", controls.dataSourceVideoSample.checked ? "1" : "0");
      localStorage.setItem("pixelation-ui", params.toString());
    }

    function restoreUiState() {
      const saved = localStorage.getItem("pixelation-ui");
      if (!saved) return false;
      const params = new URLSearchParams(saved);
      const applyIf = (key, el) => {
        const v = params.get(key);
        if (v === null) return;
        el.value = v;
      };
      applyIf("mode", controls.mode);
      applyIf("method", controls.method);
      applyIf("pixel", controls.pixelSize);
      applyIf("levels", controls.levels);
      applyIf("contrast", controls.contrast);
      applyIf("brightness", controls.brightness);
      applyIf("gamma", controls.gamma);
      applyIf("noise", controls.noise);
      applyIf("blur", controls.blur);
      applyIf("black", controls.blackPoint);
      applyIf("white", controls.whitePoint);
      const svgBlackOnly = params.get("svgBlackOnly");
      if (svgBlackOnly !== null) controls.svgBlackOnly.checked = svgBlackOnly === "1";
      const videoSample = params.get("videoSample");
      if (videoSample !== null) controls.dataSourceVideoSample.checked = videoSample === "1";
      return true;
    }

    controls.fileInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) {
        controls.fileNameText.textContent = "No file selected";
        return;
      }
      controls.fileNameText.textContent = file.name;
      if (file.type.startsWith("video/")) {
        loadVideoFromFile(file);
        return;
      }
      loadImageFromFile(file);
    });

    function setTab(tab, skipAutoLoad = false) {
      const isUpload = tab === "upload";
      tabRadioLabels.forEach((label) => {
        const input = label.querySelector("input");
        label.classList.toggle("active", input && input.value === tab);
      });
      controls.uploadPanel.classList.toggle("active", isUpload);
      controls.sourcePanel.classList.toggle("active", !isUpload);
      if (isUpload) {
        if (!skipAutoLoad) {
          controls.dataSource.value = "";
          updateDataSourceInfo();
        }
        if (!controls.fileInput.value) {
          loadImageFromDataUrl(createDefaultPlaceholder());
        }
        if (!skipAutoLoad) {
          const next = window.location.pathname;
          window.history.replaceState({}, "", next);
        }
      } else {
        if (!skipAutoLoad) {
          stopCurrentMedia();
          controls.fileInput.value = "";
          controls.fileNameText.textContent = "No file selected";
        }
      }
    }

    tabRadios.forEach((radio) => {
      radio.addEventListener("change", (e) => {
        const value = e.target.value;
        setTab(value);
        if (value === "source") {
          updateDataSourceInfo();
          if (controls.dataSource.value) loadSampleForSelection();
        }
      });
    });

    Object.values(controls).forEach((el) => {
      if (!el || typeof el.addEventListener !== "function") return;
      if (
        el === controls.fileInput ||
        el === controls.dataSource ||
        el === controls.dataSourceLink ||
        el === controls.toolPreset ||
        el === controls.downloadBtn ||
        el === controls.downloadSvgBtn ||
        el === controls.svgBlackOnly ||
        el === controls.playPauseBtn ||
        el === controls.recordBtn ||
        el === controls.statusText
      ) return;
      el.addEventListener("input", processImage);
      el.addEventListener("change", processImage);
    });

    const persistInputs = [
      controls.mode,
      controls.method,
      controls.pixelSize,
      controls.levels,
      controls.contrast,
      controls.brightness,
      controls.gamma,
      controls.noise,
      controls.blur,
      controls.blackPoint,
      controls.whitePoint,
      controls.svgBlackOnly,
      controls.dataSourceVideoSample,
    ];
    persistInputs.forEach((el) => {
      el.addEventListener("change", storeUiState);
      el.addEventListener("input", storeUiState);
    });

    controls.toolPreset.addEventListener("change", () => {
      const presetValue = controls.toolPreset.value;
      if (!presetValue) return;
      state.selectedPreset = presetValue;
      applyToolPreset(presetValue);
      storeUiState();
      setTimeout(() => {
        controls.toolPreset.value = "";
      }, 0);
    });

    function persistSelectionToUrl() {
      const params = new URLSearchParams(window.location.search);
      params.set("source", controls.dataSource.value || "");
      params.set("video", controls.dataSourceVideoSample.checked ? "1" : "0");
      if (controls.customVideoUrl.value) {
        params.set("url", controls.customVideoUrl.value);
      } else {
        params.delete("url");
      }
      const next = `${window.location.pathname}?${params.toString()}`;
      window.history.replaceState({}, "", next);
    }

    function restoreSelectionFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const source = params.get("source");
      const video = params.get("video");
      const url = params.get("url");
      if (source) {
        tabRadios.forEach((radio) => {
          radio.checked = radio.value === "source";
        });
        setTab("source", true);
        controls.dataSource.value = source;
        if (video === "1") controls.dataSourceVideoSample.checked = true;
        if (video === "0") controls.dataSourceVideoSample.checked = false;
        if (url) controls.customVideoUrl.value = url;
        updateDataSourceInfo();
        // ensure placeholder doesn't stay if video sample takes a beat to start
        stopCurrentMedia();
        requestAnimationFrame(() => {
          loadSampleForSelection();
          if (controls.dataSourceVideoSample.checked) {
            setTimeout(() => {
              if (state.sourceType !== "video") loadSampleForSelection();
            }, 200);
          }
        });
      }
    }

    controls.dataSource.addEventListener("change", () => {
      updateDataSourceInfo();
      loadSampleForSelection();
      persistSelectionToUrl();
      storeUiState();
    });

    function loadSampleForSelection(forceStill = false) {
      const key = controls.dataSource.value;
      if (!key) {
        controls.dataSourceStatus.textContent = "";
        return;
      }
      const selected = dataSources[key];
      if (!state.sampleSeed) state.sampleSeed = Math.random();
      const sourceSeed = getSourceSeed(key);
      if (key === "custom-video") {
        const url = (controls.customVideoUrl.value || "").trim();
        if (!url) {
          controls.dataSourceStatus.textContent = "Paste a video URL first.";
          return;
        }
        stopCurrentMedia();
        sourceVideo.srcObject = null;
        sourceVideo.src = url;
        sourceVideo.onloadedmetadata = () => {
          const size = fitSourceSize(sourceVideo.videoWidth, sourceVideo.videoHeight);
          state.sourceW = size.w;
          state.sourceH = size.h;
          state.original = sourceVideo;
          state.sourceType = "video";
          setVideoActionEnabled(true);
          controls.playPauseBtn.textContent = "Pause";
          sourceVideo.play().then(() => {
            startVideoLoop();
            processImage();
          }).catch(() => {
            controls.playPauseBtn.textContent = "Play";
            processImage();
          });
        };
        controls.dataSourceStatus.textContent = "Loaded custom video URL.";
        return;
      }
      if (!forceStill && controls.dataSourceVideoSample.checked) {
        stopCurrentMedia();
        const videoSample = startVideoSampleForSource(key, sourceSeed);
        if (!videoSample) {
          controls.dataSourceStatus.textContent = "No local video sample available for this source.";
          return;
        }
        controls.dataSourceStatus.textContent = "Loaded local video sample.";
        loadVideoFromStream(videoSample.stream, videoSample.width, videoSample.height);
      } else {
        const sample = generateSampleForSource(key, sourceSeed);
        if (!sample) {
          if (selected && selected.prefersVideo) {
            stopCurrentMedia();
            const videoSample = startVideoSampleForSource(key, sourceSeed);
            if (!videoSample) {
              controls.dataSourceStatus.textContent = "No local sample available for this source.";
              return;
            }
            controls.dataSourceStatus.textContent = "Loaded local video sample.";
            loadVideoFromStream(videoSample.stream, videoSample.width, videoSample.height);
            return;
          }
          controls.dataSourceStatus.textContent = "No local sample available for this source.";
          return;
        }
        controls.dataSourceStatus.textContent = "Loaded local sample.";
        loadImageFromDataUrl(sample.toDataURL("image/png"));
      }
    }

    controls.customVideoUrl.addEventListener("change", () => {
      if (controls.dataSource.value === "custom-video") {
        loadSampleForSelection();
        persistSelectionToUrl();
        storeUiState();
      }
    });

    controls.dataSourceVideoSample.addEventListener("change", () => {
      if (!controls.dataSource.value) return;
      if (!controls.dataSourceVideoSample.checked) {
        stopCurrentMedia();
        loadSampleForSelection(true);
        persistSelectionToUrl();
        storeUiState();
        return;
      }
      loadSampleForSelection();
      persistSelectionToUrl();
      storeUiState();
    });


    controls.toolPreset.addEventListener("mousedown", () => {
      syncMenuSelectionForOpen();
    });

    controls.toolPreset.addEventListener("touchstart", () => {
      syncMenuSelectionForOpen();
    });

    controls.toolPreset.addEventListener("keydown", () => {
      syncMenuSelectionForOpen();
    });

    controls.toolPreset.addEventListener("focus", () => {
      syncMenuSelectionForOpen();
    });

    controls.toolPreset.addEventListener("blur", () => {
      controls.toolPreset.value = "";
    });

    controls.playPauseBtn.addEventListener("click", async () => {
      if (state.sourceType !== "video") return;
      if (state.isTranscoding) return;
      if (sourceVideo.paused) {
        try {
          await sourceVideo.play();
          controls.playPauseBtn.textContent = "Pause";
          startVideoLoop();
        } catch (_err) {
          controls.playPauseBtn.textContent = "Play";
        }
        return;
      }

      if (state.isRecording) stopRecording();
      sourceVideo.pause();
      controls.playPauseBtn.textContent = "Play";
      stopVideoLoop();
      processImage();
    });

    controls.recordBtn.addEventListener("click", async () => {
      if (state.sourceType !== "video") return;
      if (state.isTranscoding) return;
      if (state.isRecording) {
        stopRecording();
        return;
      }
      await startRecording();
    });

    controls.downloadBtn.addEventListener("click", () => {
      if (!canvas.width || !canvas.height) return;
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = nextExportFileName("png");
      a.click();
    });

    controls.downloadSvgBtn.addEventListener("click", () => {
      if (!canvas.width || !canvas.height) return;
      const svg = buildSvgFromWorkCanvas(controls.svgBlackOnly.checked);
      if (!svg) return;
      const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = nextExportFileName("svg");
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    (function initPlaceholder() {
      const params = new URLSearchParams(window.location.search);
      const source = params.get("source");
      const derivedSeed = Math.floor(Math.random() * 1e9);
      state.sampleSeed = derivedSeed / 1e9;
      state.refreshSeed = derivedSeed;
      const restored = restoreUiState();
      if (!source) {
        const img = new Image();
        img.onload = () => {
          const size = fitSourceSize(img.naturalWidth, img.naturalHeight);
          state.original = img;
          state.sourceType = "image";
          state.sourceW = size.w;
          state.sourceH = size.h;
          processImage();
        };
        img.src = createDefaultPlaceholder();
      }
      if (!restored) {
        applyToolPreset("pixelation-base");
      }
      controls.toolPreset.value = "";
      updateDataSourceInfo();
    })();

    restoreSelectionFromUrl();
  </script>
</body>
</html>
