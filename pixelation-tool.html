<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixelation</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap");

    :root {
      --bg: #090909;
      --panel: #121212;
      --ink: #f2f2f2;
      --muted: #a8a8a8;
      --line: #2a2a2a;
      --accent: #f2f2f2;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--ink);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 10%, #181818 0%, rgba(24, 24, 24, 0) 40%),
        radial-gradient(circle at 85% 90%, #151515 0%, rgba(21, 21, 21, 0) 35%),
        var(--bg);
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
      padding: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.45);
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
    }

    .title-select {
      margin: 0 0 8px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 15px;
      letter-spacing: 0.02em;
      font-weight: 700;
    }

    p.sub {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 11px;
    }

    .control {
      margin-bottom: 12px;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 6px;
      color: var(--muted);
    }

    input[type="range"], select, input[type="file"], button {
      width: 100%;
    }

    input[type="range"] {
      appearance: none;
      -webkit-appearance: none;
      height: 2px;
      border-radius: 999px;
      background: #2d2d2d;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid #d8d8d8;
      background: #0f0f0f;
      box-shadow: none;
      cursor: ew-resize;
    }

    input[type="range"]::-moz-range-track {
      height: 2px;
      border: none;
      border-radius: 999px;
      background: #2d2d2d;
    }

    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid #d8d8d8;
      background: #0f0f0f;
      cursor: ew-resize;
    }

    select, button, input[type="file"] {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 8px;
      background: #0f0f0f;
      color: var(--ink);
      font-family: inherit;
      font-size: 11px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    button:hover {
      background: #1b1b1b;
      border-color: #3a3a3a;
    }

    .canvas-wrap {
      background: #050505;
      border-radius: 16px;
      border: 1px solid #1f1f1f;
      overflow: hidden;
      min-height: 70vh;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      grid-column: 1;
      grid-row: 1;
    }

    canvas {
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
      display: block;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .tab-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
      padding: 6px;
      border: 0;
      border-radius: 12px;
      background: #0e0e0e;
    }

    .tab-radio {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      background: #0f0f0f;
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 120ms ease, color 120ms ease, background-color 120ms ease;
      user-select: none;
    }

    .tab-radio input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .tab-radio .radio-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      border: 1px solid var(--muted);
      background: transparent;
    }

    .tab-radio.active {
      color: var(--ink);
      border-color: transparent;
      background: #141414;
    }

    .tab-radio.active .radio-dot {
      border-color: var(--ink);
      background: var(--ink);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }
    .button-row + .button-row {
      margin-top: 10px;
    }

    .download-section-title {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.02em;
    }

    .hint {
      margin-top: 6px;
      font-size: 10px;
      color: var(--muted);
    }

    .hint a {
      color: inherit;
      text-decoration: none;
    }

    .panel-footer {
      margin: auto 0 0;
      font-size: 10px;
      color: var(--muted);
    }

    .panel-footer a {
      color: inherit;
      text-decoration: none;
    }

    .check-control {
      margin-top: 8px;
      margin-bottom: 18px;
      padding-bottom: 2px;
    }

    .check-control label {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      margin-bottom: 0;
      cursor: pointer;
    }

    .check-control input[type="checkbox"] {
      width: auto;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .file-picker {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #0f0f0f;
    }

    .control .file-btn {
      display: inline-block;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 7px 10px;
      background: #202020;
      color: var(--ink);
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      margin-bottom: 0;
      justify-content: initial;
    }

    .control .file-btn:hover {
      background: #2a2a2a;
      border-color: #4a4a4a;
    }

    .palette-control {
      display: none;
    }
    .palette-control.active {
      display: block;
    }
    .palette-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .palette-chip {
      display: grid;
      gap: 6px;
      align-items: center;
      justify-items: center;
      text-align: center;
      font-size: 10px;
      color: var(--muted);
    }
    .chip-swatch {
      width: 100%;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: transparent;
      padding: 0;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .color-popover {
      position: fixed;
      z-index: 50;
      min-width: 220px;
      background: #141414;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.6);
    }
    .color-popover-header {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .color-picker {
      display: grid;
      gap: 8px;
    }
    .sv-canvas {
      width: 100%;
      height: 140px;
      border-radius: 10px;
      cursor: crosshair;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .hue-row {
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
      gap: 8px;
    }
    .color-preview {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: #fff;
    }
    .hue-slider {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      appearance: none;
      background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .hue-slider::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #111;
      cursor: pointer;
    }
    .hue-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #111;
      cursor: pointer;
    }
    .color-hex-input {
      width: 100%;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      background: #0f0f0f;
      color: #fff;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      padding: 0 8px;
      text-transform: lowercase;
      outline: none;
    }
    .color-swatch-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .color-swatch-btn {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .file-name {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 960px) {
      body {
        grid-template-columns: 1fr;
      }
      .canvas-wrap {
        grid-column: 1;
        grid-row: 1;
      }
      .panel {
        grid-column: 1;
        grid-row: 2;
      }
      .canvas-wrap {
        min-height: 48vh;
      }
    }
  </style>
</head>
<body>
  <aside class="panel">
    <select id="toolPreset" class="title-select" aria-label="Tool preset">
      <option value="" disabled>Choose Effects</option>
      <option value="pixelation-base">Pixelation</option>
      <option value="photo-enhance">Photo Enhance</option>
      <option value="noir-contrast">Noir Contrast</option>
      <option value="soft-vintage">Soft Vintage</option>
      <option value="crt-grit">CRT Grit</option>
    </select>

    <div class="tab-row">
      <label class="tab-radio active">
        <input type="radio" name="inputMode" value="upload" checked />
        <span class="radio-dot" aria-hidden="true"></span>
        Upload
      </label>
      <label class="tab-radio">
        <input type="radio" name="inputMode" value="source" />
        <span class="radio-dot" aria-hidden="true"></span>
        Data Source
      </label>
    </div>

    <div id="uploadPanel" class="tab-panel active">
      <div class="control">
        <label>Upload Image / Video</label>
        <input id="fileInput" class="file-input" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" />
        <div class="file-picker">
          <label for="fileInput" class="file-btn">Choose File</label>
          <span id="fileNameText" class="file-name">No file selected</span>
        </div>
        <p class="hint">MP4/WebM/MOV input supported.</p>
      </div>
    </div>

    <div id="sourcePanel" class="tab-panel">
      <div class="control">
        <label for="dataSource">Data Source</label>
        <select id="dataSource">
          <option value="nasa-svs-atmosphere">1. NASA SVS: Atmosphere & Weather</option>
          <option value="noaa-goes-earth-orbit">2. NOAA GOES: Earth from Orbit</option>
          <option value="noaa-goes-16-videos">3. NOAA GOES-16 Data & Imagery Videos</option>
          <option value="nasa-image-video">4. NASA Image & Video Library</option>
          <option value="usgs-earthquake">5. USGS Earthquake Hazards Videos</option>
        </select>
        <p id="dataSourceLink" class="hint"></p>
        <div class="control check-control">
        <label for="dataSourceVideoSample">
          <input id="dataSourceVideoSample" type="checkbox" checked />
          Video mode sample
        </label>
      </div>
        <p id="dataSourceStatus" class="hint"></p>
      </div>
    </div>
    <div class="row">
      <div class="control">
        <label for="mode">Output Mode</label>
        <select id="mode">
          <option value="mono">Mono</option>
          <option value="rgb">RGB</option>
        </select>
      </div>
      <div class="control">
        <label for="method">Algorithm</label>
        <select id="method">
          <option value="floyd">Floyd-Steinberg</option>
          <option value="bayer4">Bayer 4x4</option>
          <option value="random">Random Threshold</option>
          <option value="ascii">ASCII</option>
          <option value="shape-mosaic">Shape Mosaic</option>
        </select>
      </div>
    </div>

    <div id="paletteRow" class="control palette-control">
      <label>Color Chips (RGB)</label>
      <div class="palette-row">
        <div class="palette-chip">
          <button id="chip1Btn" class="chip-swatch" type="button" data-chip="1"></button>
          <input id="chip1" type="hidden" value="#d06020" />
          <div id="chip1Hex">#d06020</div>
        </div>
        <div class="palette-chip">
          <button id="chip2Btn" class="chip-swatch" type="button" data-chip="2"></button>
          <input id="chip2" type="hidden" value="#58b068" />
          <div id="chip2Hex">#58b068</div>
        </div>
        <div class="palette-chip">
          <button id="chip3Btn" class="chip-swatch" type="button" data-chip="3"></button>
          <input id="chip3" type="hidden" value="#3868d8" />
          <div id="chip3Hex">#3868d8</div>
        </div>
        <div class="palette-chip">
          <button id="chip4Btn" class="chip-swatch" type="button" data-chip="4"></button>
          <input id="chip4" type="hidden" value="#e8c840" />
          <div id="chip4Hex">#e8c840</div>
        </div>
        <div class="palette-chip">
          <button id="chip5Btn" class="chip-swatch" type="button" data-chip="5"></button>
          <input id="chip5" type="hidden" value="#182890" />
          <div id="chip5Hex">#182890</div>
        </div>
      </div>
    </div>

    <div id="colorPopover" class="color-popover" hidden>
      <div class="color-popover-header">HEX</div>
      <div class="color-picker">
        <canvas id="svCanvas" class="sv-canvas" width="220" height="140"></canvas>
        <div class="hue-row">
          <div id="colorPreview" class="color-preview"></div>
          <input id="hueSlider" class="hue-slider" type="range" min="0" max="360" value="0" />
        </div>
        <input id="colorHexInput" class="color-hex-input" type="text" value="#ffffff" />
      </div>
      <div class="color-swatch-grid">
        <button class="color-swatch-btn" data-color="#ff3b30" style="background:#ff3b30"></button>
        <button class="color-swatch-btn" data-color="#ff9500" style="background:#ff9500"></button>
        <button class="color-swatch-btn" data-color="#ffcc00" style="background:#ffcc00"></button>
        <button class="color-swatch-btn" data-color="#34c759" style="background:#34c759"></button>
        <button class="color-swatch-btn" data-color="#00c7be" style="background:#00c7be"></button>
        <button class="color-swatch-btn" data-color="#007aff" style="background:#007aff"></button>
        <button class="color-swatch-btn" data-color="#5856d6" style="background:#5856d6"></button>
        <button class="color-swatch-btn" data-color="#af52de" style="background:#af52de"></button>
        <button class="color-swatch-btn" data-color="#ff2d55" style="background:#ff2d55"></button>
        <button class="color-swatch-btn" data-color="#ff6b00" style="background:#ff6b00"></button>
        <button class="color-swatch-btn" data-color="#0a0a0a" style="background:#0a0a0a"></button>
        <button class="color-swatch-btn" data-color="#1c1c1e" style="background:#1c1c1e"></button>
      </div>
    </div>

    <div class="control">
      <label for="pixelSize">Pixel Size <span id="pixelSizeVal"></span></label>
      <input id="pixelSize" type="range" min="1" max="32" value="4" />
    </div>

    <div class="control">
      <label for="levels">Levels <span id="levelsVal"></span></label>
      <input id="levels" type="range" min="2" max="8" value="2" />
    </div>

    <div class="control">
      <label for="contrast">Contrast <span id="contrastVal"></span></label>
      <input id="contrast" type="range" min="0" max="3" step="0.01" value="1.2" />
    </div>

    <div class="control">
      <label for="brightness">Brightness <span id="brightnessVal"></span></label>
      <input id="brightness" type="range" min="-120" max="120" value="0" />
    </div>

    <div class="control">
      <label for="gamma">Gamma <span id="gammaVal"></span></label>
      <input id="gamma" type="range" min="0.3" max="2.6" step="0.01" value="1" />
    </div>

    <div class="control">
      <label for="noise">Noise <span id="noiseVal"></span></label>
      <input id="noise" type="range" min="0" max="80" value="0" />
    </div>

    <div class="control">
      <label for="blur">Blur <span id="blurVal"></span></label>
      <input id="blur" type="range" min="0" max="4" step="0.1" value="0" />
    </div>

    <div class="row">
      <div class="control">
        <label for="blackPoint">Black Point <span id="blackPointVal"></span></label>
        <input id="blackPoint" type="range" min="0" max="100" value="0" />
      </div>
      <div class="control">
        <label for="whitePoint">White Point <span id="whitePointVal"></span></label>
        <input id="whitePoint" type="range" min="155" max="255" value="255" />
      </div>
    </div>

    <p class="download-section-title">Download Option</p>
    <div class="row button-row">
      <button id="downloadSvgBtn" type="button">SVG</button>
      <button id="downloadBtn" type="button">PNG</button>
    </div>
    <div class="control check-control">
      <label for="svgBlackOnly">
        <input id="svgBlackOnly" type="checkbox" checked />
        SVG: Black only (remove white area)
      </label>
    </div>
    <div class="row button-row">
      <button id="playPauseBtn" type="button" disabled>Play</button>
      <button id="recordBtn" type="button" disabled>Export</button>
    </div>
    <p class="hint">Export auto-converts WebM to MP4.</p>
    <p id="statusText" class="hint"></p>
    <p class="panel-footer"><a href="https://miterlab.com/" target="_blank" rel="noopener noreferrer">©2026 Miterlab Inc.</a></p>
  </aside>

  <main class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </main>

  <script type="module">
    import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js";
    import { fetchFile, toBlobURL } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const work = document.createElement("canvas");
    const wctx = work.getContext("2d", { willReadFrequently: true });
    const sourceVideo = document.createElement("video");
    sourceVideo.muted = true;
    sourceVideo.loop = true;
    sourceVideo.playsInline = true;
    sourceVideo.preload = "auto";

    const tabRadios = document.querySelectorAll("input[name='inputMode']");
    const tabRadioLabels = document.querySelectorAll(".tab-radio");

    const controls = {
      fileInput: document.getElementById("fileInput"),
      fileNameText: document.getElementById("fileNameText"),
      uploadPanel: document.getElementById("uploadPanel"),
      sourcePanel: document.getElementById("sourcePanel"),
      dataSource: document.getElementById("dataSource"),
      dataSourceLink: document.getElementById("dataSourceLink"),
      dataSourceVideoSample: document.getElementById("dataSourceVideoSample"),
      dataSourceStatus: document.getElementById("dataSourceStatus"),
      mode: document.getElementById("mode"),
      method: document.getElementById("method"),
      paletteRow: document.getElementById("paletteRow"),
      chip1: document.getElementById("chip1"),
      chip2: document.getElementById("chip2"),
      chip3: document.getElementById("chip3"),
      chip4: document.getElementById("chip4"),
      chip5: document.getElementById("chip5"),
      chip1Btn: document.getElementById("chip1Btn"),
      chip2Btn: document.getElementById("chip2Btn"),
      chip3Btn: document.getElementById("chip3Btn"),
      chip4Btn: document.getElementById("chip4Btn"),
      chip5Btn: document.getElementById("chip5Btn"),
      chip1Hex: document.getElementById("chip1Hex"),
      chip2Hex: document.getElementById("chip2Hex"),
      chip3Hex: document.getElementById("chip3Hex"),
      chip4Hex: document.getElementById("chip4Hex"),
      chip5Hex: document.getElementById("chip5Hex"),
      colorPopover: document.getElementById("colorPopover"),
      svCanvas: document.getElementById("svCanvas"),
      hueSlider: document.getElementById("hueSlider"),
      colorPreview: document.getElementById("colorPreview"),
      colorHexInput: document.getElementById("colorHexInput"),
      toolPreset: document.getElementById("toolPreset"),
      pixelSize: document.getElementById("pixelSize"),
      levels: document.getElementById("levels"),
      contrast: document.getElementById("contrast"),
      brightness: document.getElementById("brightness"),
      gamma: document.getElementById("gamma"),
      noise: document.getElementById("noise"),
      blur: document.getElementById("blur"),
      blackPoint: document.getElementById("blackPoint"),
      whitePoint: document.getElementById("whitePoint"),
      playPauseBtn: document.getElementById("playPauseBtn"),
      downloadBtn: document.getElementById("downloadBtn"),
      downloadSvgBtn: document.getElementById("downloadSvgBtn"),
      svgBlackOnly: document.getElementById("svgBlackOnly"),
      recordBtn: document.getElementById("recordBtn"),
      statusText: document.getElementById("statusText"),
    };

    const valueViews = {
      pixelSize: document.getElementById("pixelSizeVal"),
      levels: document.getElementById("levelsVal"),
      contrast: document.getElementById("contrastVal"),
      brightness: document.getElementById("brightnessVal"),
      gamma: document.getElementById("gammaVal"),
      noise: document.getElementById("noiseVal"),
      blur: document.getElementById("blurVal"),
      blackPoint: document.getElementById("blackPointVal"),
      whitePoint: document.getElementById("whitePointVal"),
    };

    const presetOptionLabels = new Map(
      Array.from(controls.toolPreset.options).map((opt) => [opt.value, opt.textContent])
    );

    const state = {
      original: null,

    function updateDataSourceInfo() {

      if (selected.url) {

        controls.dataSourceLink.textContent = "";

        state.sourceH = size.h;

    function makeSampleCanvas() {
      const c = document.createElement("canvas");
      c.width = 900;
      c.height = 560;
      return c;
    }

    function createDefaultPlaceholder() {
      const sample = document.createElement("canvas");
      sample.width = 900;
      sample.height = 560;
      const sctx = sample.getContext("2d");

      const g = sctx.createLinearGradient(0, 0, sample.width, sample.height);
      g.addColorStop(0, "#f5d68a");
      g.addColorStop(0.5, "#db7f53");
      g.addColorStop(1, "#2f2725");
      sctx.fillStyle = g;
      sctx.fillRect(0, 0, sample.width, sample.height);

      sctx.fillStyle = "rgba(255,255,255,0.35)";
      sctx.beginPath();
      sctx.arc(220, 180, 120, 0, Math.PI * 2);
      sctx.fill();

      sctx.fillStyle = "rgba(20,20,20,0.35)";
      sctx.beginPath();
      sctx.ellipse(630, 330, 190, 120, 0.2, 0, Math.PI * 2);
      sctx.fill();

      sctx.fillStyle = "rgba(255,255,255,0.8)";
      sctx.font = "700 64px 'JetBrains Mono', monospace";
      sctx.fillText("DITHER", 260, 315);

      return sample.toDataURL("image/png");
    }

    function hashString(s) {
      let x = 2166136261;
      for (let i = 0; i < s.length; i++) x = (x ^ s.charCodeAt(i)) * 16777619;
      return x >>> 0;
    }

    function makeSeededRngFromSeed(seed) {
      let x = seed >>> 0;
      if (!x) x = 123456789;
      return () => {
        x ^= x << 13;
        x ^= x >>> 17;
        x ^= x << 5;
        return (x >>> 0) / 4294967296;
      };
    }

    function makeSeededRng(key, baseSeed = null) {
      const seed = baseSeed !== null ? baseSeed : Math.floor(state.sampleSeed * 1e9);
      return makeSeededRngFromSeed((hashString(key) ^ seed) >>> 0);
    }

    function getSourceSeed(key) {
      if (!state.refreshSeed) state.refreshSeed = Math.floor(Math.random() * 1e9);
      return (hashString(key) ^ state.refreshSeed) >>> 0;
    }

    function generateWaveformSample(style, rng) {
      const c = makeSampleCanvas();
      const cctx = c.getContext("2d");
      const paletteSets = {
        env: [
          ["#0b0b0b", "#f2f2f2"],
          ["#0a0f14", "#9fd3ff"],
          ["#101012", "#ffd166"],
        ],
        sat: [
          ["#090b14", "#7fd2ff"],
          ["#0b0f18", "#59b0ff"],
          ["#0b0d12", "#a6c8ff"],
        ],
        quake: [
          ["#0b0707", "#ffb3a7"],
          ["#100a0a", "#ff8474"],
          ["#120c0c", "#ffd1c4"],
        ],
      };
      const palettes = paletteSets[style] || paletteSets.env;
      const palette = palettes[Math.floor(rng() * palettes.length)];
      cctx.fillStyle = palette[0];
      cctx.fillRect(0, 0, c.width, c.height);
      cctx.strokeStyle = palette[1];
      cctx.lineWidth = style === "quake" ? 2.4 + rng() * 2.2 : 1.5 + rng() * 1.5;
      cctx.beginPath();
      const mid = c.height / 2;
      const phase = rng() * Math.PI * 2;
      for (let x = 0; x < c.width; x++) {
        const t = x / c.width;
        const ampBase = style === "speech" ? 80 : style === "sat" ? 70 : style === "quake" ? 140 : 120;
        const freqBase = style === "urban" ? 8 : style === "sat" ? 10 : style === "quake" ? 3 : 5;
        const amp = ampBase * (0.7 + rng() * 0.6);
        const freq = freqBase + (rng() * 2 - 1);
        let y =
          mid +
          Math.sin(t * Math.PI * 2 * freq + phase) *
            amp *
            (0.55 + 0.45 * Math.sin(t * Math.PI * 2 + phase));
        if (style === "quake") {
          const spikes = Math.sin(t * Math.PI * 18 + phase) * Math.sin(t * Math.PI * 2 + phase);
          y += spikes * 18;
        }
        if (x === 0) cctx.moveTo(x, y);
        else cctx.lineTo(x, y);
      }
      cctx.stroke();
      if (style === "sat") {
        cctx.strokeStyle = "rgba(100,190,255,0.35)";
        cctx.lineWidth = 1;
        for (let i = 0; i < 5; i++) {
          cctx.beginPath();
          const y = (c.height / 6) * (i + 1) + 10 * Math.sin(phase + i);
          for (let x = 0; x < c.width; x += 10) {
            const dy = 6 * Math.sin(x / 50 + phase + i);
            if (x === 0) cctx.moveTo(x, y + dy);
            else cctx.lineTo(x, y + dy);
          }
          cctx.stroke();
        }
      }
      return c;
    }

    function generateChladniSample(rng) {
      const c = makeSampleCanvas();
      const cctx = c.getContext("2d");
      cctx.fillStyle = rng() > 0.5 ? "#111" : "#0e0e10";
      cctx.fillRect(0, 0, c.width, c.height);
      const mode = Math.floor(rng() * 3);
      cctx.strokeStyle = "#f2f2f2";
      cctx.lineWidth = 0.8 + rng() * 1.2;
      if (mode === 0) {
        const cols = 6 + Math.floor(rng() * 6);
        const rows = 5 + Math.floor(rng() * 5);
        for (let i = 1; i < cols; i++) {
          cctx.beginPath();
          cctx.moveTo((c.width / cols) * i, 0);
          cctx.lineTo((c.width / cols) * i, c.height);
          cctx.stroke();
        }
        for (let j = 1; j < rows; j++) {
          cctx.beginPath();
          cctx.moveTo(0, (c.height / rows) * j);
          cctx.lineTo(c.width, (c.height / rows) * j);
          cctx.stroke();
        }
      } else if (mode === 1) {
        const kx = 2 + Math.floor(rng() * 5);
        const ky = 2 + Math.floor(rng() * 4);
        for (let x = 0; x < c.width; x += 6) {
          const t = x / c.width;
          const y = c.height / 2 + Math.sin(t * Math.PI * 2 * kx) * (c.height * 0.25);
          cctx.beginPath();
          cctx.moveTo(x, 0);
          cctx.lineTo(x, y);
          cctx.stroke();
        }
        for (let y = 0; y < c.height; y += 6) {
          const t = y / c.height;
          const x = c.width / 2 + Math.sin(t * Math.PI * 2 * ky) * (c.width * 0.2);
          cctx.beginPath();
          cctx.moveTo(0, y);
          cctx.lineTo(x, y);
          cctx.stroke();
        }
      } else {
        const rings = 10 + Math.floor(rng() * 10);
        for (let i = 0; i < rings; i++) {
          const r = 20 + i * (8 + rng() * 6);
          cctx.beginPath();
          cctx.ellipse(c.width / 2, c.height / 2, r * (1.3 + rng() * 0.4), r, rng() * Math.PI, 0, Math.PI * 2);
          cctx.stroke();
        }
      }
      cctx.fillStyle = "rgba(255,255,255,0.5)";
      for (let k = 0; k < 30; k++) {
        cctx.fillRect(rng() * c.width, rng() * c.height, 1.2 + rng() * 1.2, 1.2 + rng() * 1.2);
      }
      return c;
    }

    function generateFluidSample(rng, style = "svs") {
      const c = makeSampleCanvas();
      const cctx = c.getContext("2d");
      const g = cctx.createLinearGradient(0, 0, c.width, c.height);
      const gradientsByStyle = {
        svs: [
          ["#0c1a2b", "#162a3b", "#1f3b4d"],
          ["#101c2a", "#1b3a4a", "#224b6a"],
          ["#0a1a1d", "#14303b", "#1a4a57"],
        ],
        ocean: [
          ["#031319", "#0b2830", "#123f4a"],
          ["#04181f", "#0b2c35", "#134654"],
          ["#061b22", "#0f3340", "#18495a"],
        ],
        orbit: [
          ["#0a0f1a", "#121b2a", "#1b2740"],
          ["#070d18", "#0f1a2c", "#18243b"],
          ["#0b111f", "#141f33", "#1c2b45"],
        ],
      };
      const gradients = gradientsByStyle[style] || gradientsByStyle.svs;
      const palette = gradients[Math.floor(rng() * gradients.length)];
      g.addColorStop(0, palette[0]);
      g.addColorStop(0.5, palette[1]);
      g.addColorStop(1, palette[2]);
      cctx.fillStyle = g;
      cctx.fillRect(0, 0, c.width, c.height);
      cctx.strokeStyle = `rgba(255,255,255,${0.35 + rng() * 0.4})`;
      if (style === "orbit") {
        const horizonY = c.height * (0.62 + rng() * 0.1);
        const earthR = c.width * (0.9 + rng() * 0.15);
        cctx.fillStyle = "#06101a";
        cctx.beginPath();
        cctx.arc(c.width / 2, horizonY + earthR * 0.55, earthR, Math.PI, Math.PI * 2);
        cctx.fill();

        const glow = cctx.createLinearGradient(0, horizonY - 30, 0, horizonY + 30);
        glow.addColorStop(0, "rgba(90,170,255,0.55)");
        glow.addColorStop(1, "rgba(90,170,255,0)");
        cctx.fillStyle = glow;
        cctx.fillRect(0, horizonY - 30, c.width, 60);

        cctx.strokeStyle = "rgba(140,200,255,0.35)";
        cctx.lineWidth = 1;
        for (let i = 0; i < 6; i++) {
          cctx.beginPath();
          const y = horizonY + (i + 1) * 10 + 6 * Math.sin(i + rng());
          cctx.moveTo(0, y);
          cctx.lineTo(c.width, y + 4 * Math.sin(i + rng()));
          cctx.stroke();
        }
      } else {
        const bands = style === "ocean" ? 14 + Math.floor(rng() * 6) : 10 + Math.floor(rng() * 8);
        for (let i = 0; i < bands; i++) {
          cctx.beginPath();
          const y = (c.height / bands) * i + 10 * Math.sin(i + rng());
          for (let x = 0; x < c.width; x += 8) {
            const t = x / c.width;
            const dy = (14 + rng() * 14) * Math.sin(t * Math.PI * (3 + rng() * 3) + i);
            if (x === 0) cctx.moveTo(x, y + dy);
            else cctx.lineTo(x, y + dy);
          }
          cctx.stroke();
        }
      }
      return c;
    }

    function generateStarfieldSample(rng) {
      const c = makeSampleCanvas();
      const cctx = c.getContext("2d");
      cctx.fillStyle = "#04060d";
      cctx.fillRect(0, 0, c.width, c.height);
      const nebulae = [
        ["rgba(90,140,255,0.35)", "rgba(90,140,255,0)"],
        ["rgba(255,120,80,0.3)", "rgba(255,120,80,0)"],
        ["rgba(120,255,200,0.25)", "rgba(120,255,200,0)"],
      ];
      for (let i = 0; i < 3; i++) {
        const [c0, c1] = nebulae[i];
        const x = rng() * c.width;
        const y = rng() * c.height;
        const r = 180 + rng() * 220;
        const g = cctx.createRadialGradient(x, y, 10, x, y, r);
        g.addColorStop(0, c0);
        g.addColorStop(1, c1);
        cctx.fillStyle = g;
        cctx.beginPath();
        cctx.arc(x, y, r, 0, Math.PI * 2);
        cctx.fill();
      }
      cctx.fillStyle = "rgba(255,255,255,0.85)";
      const count = 100 + Math.floor(rng() * 140);
      for (let i = 0; i < count; i++) {
        const x = rng() * c.width;
        const y = rng() * c.height;
        const r = 0.6 + rng() * 1.8;
        cctx.beginPath();
        cctx.arc(x, y, r, 0, Math.PI * 2);
        cctx.fill();
      }
      return c;
    }

    function generateCymaticsSample(rng) {
      const c = makeSampleCanvas();
      const cctx = c.getContext("2d");
      cctx.fillStyle = "#0a0a0a";
      cctx.fillRect(0, 0, c.width, c.height);
      const mode = Math.floor(rng() * 3);
      cctx.strokeStyle = `rgba(255,255,255,${0.5 + rng() * 0.35})`;
      if (mode === 0) {
        const step = 12 + Math.floor(rng() * 10);
        const twist = rng() * 0.6;
        for (let r = 20; r < 260; r += step) {
          cctx.beginPath();
          cctx.ellipse(c.width / 2, c.height / 2, r * 1.6, r, twist, 0, Math.PI * 2);
          cctx.stroke();
        }
      } else if (mode === 1) {
        const spokes = 6 + Math.floor(rng() * 8);
        for (let s = 0; s < spokes; s++) {
          const angle = (Math.PI * 2 * s) / spokes;
          cctx.beginPath();
          for (let r = 20; r < 280; r += 6) {
            const wobble = 10 * Math.sin(r * 0.08 + rng() * 6);
            const x = c.width / 2 + Math.cos(angle) * (r + wobble);
            const y = c.height / 2 + Math.sin(angle) * (r + wobble);
            if (r === 20) cctx.moveTo(x, y);
            else cctx.lineTo(x, y);
          }
          cctx.stroke();
        }
      } else {
        const lobes = 4 + Math.floor(rng() * 6);
        for (let i = 0; i < 12; i++) {
          const r = 30 + i * 18;
          cctx.beginPath();
          for (let a = 0; a <= Math.PI * 2 + 0.01; a += Math.PI / 90) {
            const wave = Math.sin(a * lobes + i * 0.4) * (8 + rng() * 10);
            const x = c.width / 2 + Math.cos(a) * (r + wave);
            const y = c.height / 2 + Math.sin(a) * (r + wave);
            if (a === 0) cctx.moveTo(x, y);
            else cctx.lineTo(x, y);
          }
          cctx.stroke();
        }
      }
      return c;
    }

    function generateSampleForSource(key, sourceSeed) {
      const rng = makeSeededRngFromSeed(sourceSeed);
      if (key === "nasa-svs-atmosphere") return generateFluidSample(rng, "svs");
      if (key === "noaa-goes-earth-orbit") return generateFluidSample(rng, "orbit");
      if (key === "noaa-goes-16-videos") return generateWaveformSample("sat", rng);
      if (key === "nasa-image-video") return generateStarfieldSample(rng);
      if (key === "usgs-earthquake") return generateWaveformSample("quake", rng);
      return null;
    }

    function startVideoSampleFromCanvas(drawFrame) {
      const c = makeSampleCanvas();
      const cctx = c.getContext("2d");
      let t = 0;
      const render = () => {
        drawFrame(cctx, t);
        t += 1 / 60;
        state.sampleRafId = requestAnimationFrame(render);
      };
      render();
      const stream = c.captureStream(30);
      state.sampleStream = stream;
      return { stream, width: c.width, height: c.height };
    }

    function loadVideoFromStream(stream, width, height) {
      state.sourceW = width;
      state.sourceH = height;
      state.original = sourceVideo;
      state.sourceType = "video";
      setVideoActionEnabled(true);
      sourceVideo.srcObject = stream;
      const tryPlay = () => {
        tryPlayVideo().then(() => {
          processImage();
        });
      };
      sourceVideo.onloadedmetadata = () => {
        tryPlay();
      };
      // In some browsers, metadata doesn't fire for captureStream.
      setTimeout(tryPlay, 0);
    }

    function startVideoSampleForSource(key, baseSeed = null) {
      const drawer = (ctx2d, t) => {
        ctx2d.clearRect(0, 0, ctx2d.canvas.width, ctx2d.canvas.height);
        ctx2d.fillStyle = "#0b0b0b";
        ctx2d.fillRect(0, 0, ctx2d.canvas.width, ctx2d.canvas.height);
        ctx2d.strokeStyle = "rgba(255,255,255,0.75)";
        ctx2d.lineWidth = 2;
        const w = ctx2d.canvas.width;
        const h = ctx2d.canvas.height;
        const keySeed = hashString(key);
        const variationSeed = baseSeed !== null ? baseSeed : Math.floor(state.sampleSeed * 1e9);
        const randBase = (n) => {
          const v = Math.sin(n * 12.9898 + keySeed * 0.0001) * 43758.5453;
          return v - Math.floor(v);
        };
        const rand = (n) => {
          const v = Math.sin(n * 12.9898 + variationSeed * 0.0001) * 43758.5453;
          return v - Math.floor(v);
        };
        const randT = (n, tt) => {
          const v = Math.sin(n * 12.9898 + variationSeed * 0.0001 + tt * 1.37) * 43758.5453;
          return v - Math.floor(v);
        };
        const variantCount = {
          "nasa-svs-atmosphere": 3,
          "nasa-image-video": 3,
          "noaa-goes-earth-orbit": 3,
          "noaa-goes-16-videos": 3,
          "usgs-earthquake": 3,
        }[key] || 3;
        const mode = Math.floor(randBase(1) * variantCount);
        const palette = [
          ["#0b0b0b", "#f2f2f2", "#6ec6ff"],
          ["#0a0a10", "#ffd166", "#ef476f"],
          ["#0a0f0b", "#06d6a0", "#118ab2"],
        ][Math.floor(randBase(2) * 3)];
        ctx2d.fillStyle = palette[0];
        ctx2d.fillRect(0, 0, w, h);
        if (key === "noaa-goes-earth-orbit") {
          const horizonY = h * (0.62 + 0.04 * Math.sin(t * 0.4));
          const earthR = w * (0.95 + 0.05 * Math.sin(t * 0.3));
          ctx2d.fillStyle = "#07111c";
          ctx2d.beginPath();
          ctx2d.arc(w / 2, horizonY + earthR * 0.55, earthR, Math.PI, Math.PI * 2);
          ctx2d.fill();

          const glow = ctx2d.createLinearGradient(0, horizonY - 40, 0, horizonY + 40);
          glow.addColorStop(0, "rgba(80,160,255,0.6)");
          glow.addColorStop(1, "rgba(80,160,255,0)");
          ctx2d.fillStyle = glow;
          ctx2d.fillRect(0, horizonY - 40, w, 80);

          ctx2d.strokeStyle = "rgba(130,200,255,0.35)";
          ctx2d.lineWidth = 1;
          for (let i = 0; i < 7; i++) {
            const y = horizonY + 8 + i * 12 + 6 * Math.sin(t * 0.8 + i);
            ctx2d.beginPath();
            ctx2d.moveTo(0, y);
            ctx2d.lineTo(w, y + 6 * Math.sin(t + i));
            ctx2d.stroke();
          }
          return;
        }

        if (key === "nasa-image-video") {
          ctx2d.fillStyle = "#04060d";
          ctx2d.fillRect(0, 0, w, h);
          const layers = 3;
          for (let l = 0; l < layers; l++) {
            const count = 40 + l * 35;
            const speed = 6 + l * 12;
            const size = 0.8 + l * 0.6;
            ctx2d.fillStyle = `rgba(255,255,255,${0.65 - l * 0.15})`;
            for (let i = 0; i < count; i++) {
              const x = (randBase(i + l * 99) * w + t * speed * (l + 1)) % w;
              const y = randBase(i + l * 199) * h;
              ctx2d.beginPath();
              ctx2d.arc(x, y, size, 0, Math.PI * 2);
              ctx2d.fill();
            }
          }
          ctx2d.strokeStyle = "rgba(120,180,255,0.35)";
          ctx2d.lineWidth = 1;
          ctx2d.beginPath();
          ctx2d.arc(w / 2, h / 2, 140 + 20 * Math.sin(t * 0.2), 0, Math.PI * 2);
          ctx2d.stroke();
          return;
        }

        if (
          key === "nasa-svs-atmosphere" ||
          key === "noaa-goes-16-videos"
        ) {
          const svsMode = mode;
          if (svsMode === 0) {
            ctx2d.strokeStyle = "rgba(120,200,255,0.8)";
            ctx2d.lineWidth = 1.5;
            for (let i = 0; i < 6; i++) {
              ctx2d.beginPath();
              const r = 80 + i * 35;
              ctx2d.ellipse(w / 2, h / 2, r * 1.2, r, t * 0.2 + i, 0, Math.PI * 2);
              ctx2d.stroke();
            }
            ctx2d.fillStyle = "rgba(255,255,255,0.8)";
            ctx2d.beginPath();
            ctx2d.arc(w / 2 + Math.cos(t) * 120, h / 2 + Math.sin(t) * 60, 6, 0, Math.PI * 2);
            ctx2d.fill();
          } else if (svsMode === 1) {
            ctx2d.strokeStyle = "rgba(160,220,255,0.7)";
            for (let i = 0; i < 12; i++) {
              const ang = (Math.PI * 2 * i) / 12 + t * 0.2;
              ctx2d.beginPath();
              ctx2d.moveTo(w / 2, h / 2);
              ctx2d.lineTo(w / 2 + Math.cos(ang) * (140 + 40 * Math.sin(t + i)), h / 2 + Math.sin(ang) * (90 + 30 * Math.cos(t + i)));
              ctx2d.stroke();
            }
          } else {
            ctx2d.strokeStyle = "rgba(100,180,255,0.8)";
            for (let i = 0; i < 9; i++) {
              ctx2d.beginPath();
              const y = (h / 9) * i + 20 * Math.sin(t + i);
              for (let x = 0; x < w; x += 12) {
                const dy = 16 * Math.sin(x / 80 + t * 1.3 + i);
                if (x === 0) ctx2d.moveTo(x, y + dy);
                else ctx2d.lineTo(x, y + dy);
              }
              ctx2d.stroke();
            }
          }
          return;
        }
        if (key === "usgs-earthquake") {
          const usgsMode = mode;
          if (usgsMode === 0) {
            ctx2d.strokeStyle = palette[1];
            ctx2d.lineWidth = 2;
            for (let r = 40; r < 320; r += 28) {
              ctx2d.beginPath();
              const pulse = r + 20 * Math.sin(t * 2 + r / 30);
              ctx2d.arc(w / 2, h / 2, pulse, 0, Math.PI * 2);
              ctx2d.stroke();
            }
          } else if (usgsMode === 1) {
            ctx2d.strokeStyle = "rgba(255,140,120,0.8)";
            for (let i = 0; i < 18; i++) {
              const ang = (Math.PI * 2 * i) / 18 + t * 0.3;
              ctx2d.beginPath();
              ctx2d.moveTo(w / 2, h / 2);
              ctx2d.lineTo(w / 2 + Math.cos(ang) * 220, h / 2 + Math.sin(ang) * 140);
              ctx2d.stroke();
            }
          } else {
            ctx2d.strokeStyle = "rgba(255,160,140,0.8)";
            for (let i = 0; i < 10; i++) {
              ctx2d.beginPath();
              const y = (h / 10) * i + 12 * Math.sin(t + i);
              for (let x = 0; x < w; x += 10) {
                const dy = 14 * Math.sin(t * 2 + x / 80 + i);
                if (x === 0) ctx2d.moveTo(x, y + dy);
                else ctx2d.lineTo(x, y + dy);
              }
              ctx2d.stroke();
            }
          }
          return;
        }
        // fallback waveform
        const mid = h / 2;
        const amp = key === "urbansound8k" ? 110 : 120;
        const freq = key === "urbansound8k" ? 9 : 5;
        ctx2d.beginPath();
        for (let x = 0; x < w; x++) {
          const tt = x / w;
          const y = mid + Math.sin(tt * Math.PI * 2 * freq + t * 2) * amp * (0.6 + 0.4 * Math.sin(tt * Math.PI * 2 + t));
          if (x === 0) ctx2d.moveTo(x, y);
          else ctx2d.lineTo(x, y);
        }
        ctx2d.stroke();
      };
      return startVideoSampleFromCanvas(drawer);
    }

    function syncMenuSelectionForOpen() {
      controls.toolPreset.value = state.selectedPreset;
    }

    function quantize(v, levels) {
      const step = 255 / (levels - 1);
      return Math.round(v / step) * step;
    }

    function renderAscii(lum, data, w, h, pixelSize, mode) {
      const chars = " .,:;irsXA253hMHGS#9B&@";
      const fontSize = Math.max(8, Math.floor(pixelSize * 1.35));
      canvas.width = w * pixelSize;
      canvas.height = h * pixelSize;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = `${fontSize}px 'JetBrains Mono', monospace`;
      ctx.textBaseline = "top";
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const p = y * w + x;
          const i = p * 4;
          const v = clamp(Math.round(lum[p]), 0, 255);
          const idx = Math.floor((v / 255) * (chars.length - 1));
          const ch = chars[idx];
          if (mode === "rgb") {
            ctx.fillStyle = `rgb(${data[i]}, ${data[i + 1]}, ${data[i + 2]})`;
          } else {
            ctx.fillStyle = "#f2f2f2";
          }
          ctx.fillText(ch, x * pixelSize, y * pixelSize);
        }
      }
    }

    function hexToRgb(hex) {
      const clean = hex.replace("#", "").toLowerCase();
      if (clean.length !== 6) return [255, 255, 255];
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      return [r, g, b];
    }

    function rgbToHex(r, g, b) {
      const toHex = (v) => v.toString(16).padStart(2, "0");
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

    function rgbToHsv(r, g, b) {
      const rn = r / 255;
      const gn = g / 255;
      const bn = b / 255;
      const max = Math.max(rn, gn, bn);
      const min = Math.min(rn, gn, bn);
      const d = max - min;
      let h = 0;
      if (d !== 0) {
        if (max === rn) h = ((gn - bn) / d) % 6;
        else if (max === gn) h = (bn - rn) / d + 2;
        else h = (rn - gn) / d + 4;
        h *= 60;
        if (h < 0) h += 360;
      }
      const s = max === 0 ? 0 : d / max;
      const v = max;
      return [h, s, v];
    }

    function hsvToRgb(h, s, v) {
      const c = v * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = v - c;
      let r1 = 0, g1 = 0, b1 = 0;
      if (h < 60) [r1, g1, b1] = [c, x, 0];
      else if (h < 120) [r1, g1, b1] = [x, c, 0];
      else if (h < 180) [r1, g1, b1] = [0, c, x];
      else if (h < 240) [r1, g1, b1] = [0, x, c];
      else if (h < 300) [r1, g1, b1] = [x, 0, c];
      else [r1, g1, b1] = [c, 0, x];
      return [
        Math.round((r1 + m) * 255),
        Math.round((g1 + m) * 255),
        Math.round((b1 + m) * 255),
      ];
    }


    function getShapePalette() {
      return [
        hexToRgb(controls.chip1.value),
        hexToRgb(controls.chip2.value),
        hexToRgb(controls.chip3.value),
        hexToRgb(controls.chip4.value),
        hexToRgb(controls.chip5.value),
      ];
    }

    function renderShapeAscii(lum, data, w, h, pixelSize, mode) {
      canvas.width = w * pixelSize;
      canvas.height = h * pixelSize;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const palette = getShapePalette();
      const size = Math.max(2, Math.floor(pixelSize * 0.95));
      const hash2 = (x, y) => {
        let n = x * 374761393 + y * 668265263 + Math.floor(state.sampleSeed * 1e9);
        n = (n ^ (n >> 13)) * 1274126177;
        return (n ^ (n >> 16)) >>> 0;
      };
      const drawRoundRect = (x, y, w, h, r) => {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.arcTo(x + w, y, x + w, y + rr, rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
        ctx.lineTo(x + rr, y + h);
        ctx.arcTo(x, y + h, x, y + h - rr, rr);
        ctx.lineTo(x, y + rr);
        ctx.arcTo(x, y, x + rr, y, rr);
        ctx.closePath();
        ctx.fill();
      };
      const pickColor = (avgR, avgG, avgB, seed) => {
        if (mode !== "rgb") return "#f2f2f2";
        const idx = seed % palette.length;
        const base = palette[idx];
        const mix = 0.15 + ((seed >> 8) & 255) / 255 * 0.2;
        const r = Math.round(base[0] * (1 - mix) + avgR * mix);
        const g = Math.round(base[1] * (1 - mix) + avgG * mix);
        const b = Math.round(base[2] * (1 - mix) + avgB * mix);
        return `rgb(${r}, ${g}, ${b})`;
      };
      const minLum = mode === "rgb" ? 75 : 50;
      for (let y = 0; y < h; y++) {
        let x = 0;
        while (x < w) {
          const p = y * w + x;
          const v = clamp(Math.round(lum[p]), 0, 255);
          if (v < minLum) {
            x += 1;
            continue;
          }
          let x2 = x;
          let sumR = 0;
          let sumG = 0;
          let sumB = 0;
          let sumV = 0;
          while (x2 < w) {
            const p2 = y * w + x2;
            const v2 = clamp(Math.round(lum[p2]), 0, 255);
            if (v2 < minLum) break;
            const i2 = p2 * 4;
            sumR += data[i2];
            sumG += data[i2 + 1];
            sumB += data[i2 + 2];
            sumV += v2;
            x2 += 1;
          }
          const len = x2 - x;
          const avgR = Math.round(sumR / len);
          const avgG = Math.round(sumG / len);
          const avgB = Math.round(sumB / len);
          const avgV = Math.round(sumV / len);
          const seed = hash2(x, y);
          ctx.fillStyle = pickColor(avgR, avgG, avgB, seed);
          const cy = y * pixelSize + pixelSize * 0.5;
          const baseX = x * pixelSize;
          const runW = len * pixelSize;
          if (len >= 3) {
            const hPx = size * (0.9 + ((seed >> 6) & 3) * 0.12);
            drawRoundRect(baseX, cy - hPx / 2, runW + pixelSize * 0.2, hPx, hPx * 0.5);
          } else if (len === 2) {
            const hPx = size * 0.92;
            drawRoundRect(baseX, cy - hPx / 2, runW + pixelSize * 0.2, hPx, hPx * 0.5);
          } else {
            const cx = baseX + pixelSize * 0.5;
            const pick = ((seed >> 4) & 7) / 7;
            if (pick < 0.4) {
              ctx.beginPath();
              ctx.arc(cx, cy, size * 0.5, 0, Math.PI * 2);
              ctx.fill();
            } else if (pick < 0.75) {
              const wPx = size * 0.98;
              const hPx = size * 0.85;
              drawRoundRect(cx - wPx / 2, cy - hPx / 2, wPx, hPx, hPx * 0.4);
            } else {
              ctx.lineWidth = Math.max(1, Math.floor(size * 0.12));
              ctx.strokeStyle = ctx.fillStyle;
              ctx.beginPath();
              ctx.arc(cx, cy, size * 0.5, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
          // occasional vertical capsule for variation
          if (avgV > 140 && (seed & 31) === 0) {
            const hLen = 2 + ((seed >> 9) & 3);
            const hPx = hLen * pixelSize;
            const wPx = size * 0.8;
            drawRoundRect(baseX + pixelSize * 0.1, cy - hPx / 2, wPx, hPx, wPx * 0.5);
          }
          x = x2;
        }
      }
    }

    function updateValueLabels() {
      Object.keys(valueViews).forEach((k) => {
        valueViews[k].textContent = controls[k].value;
      });

    function updatePaletteVisibility() {

    function updateChipLabels() {
      controls.chip1Hex.textContent = controls.chip1.value.toLowerCase();
      controls.chip2Hex.textContent = controls.chip2.value.toLowerCase();
      controls.chip3Hex.textContent = controls.chip3.value.toLowerCase();
